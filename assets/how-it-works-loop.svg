<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1200" viewBox="0 0 1280 1200" role="img" aria-labelledby="title desc" data-release-status="local-v1.0.26-build-not-published">
  <title id="title">How Codex v2 routes Autoprompt work</title>
  <desc id="desc">The local, not-published Codex v1.0.26 build selects DIRECT, LIGHT, or ROADMAP. Each route has different planning and coordination, then risk-aware independent review and testing and a final record.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e7ebeb" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59696b"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans",sans-serif}.card{fill:#fff;stroke:#aab5b7;stroke-width:1.5}.teal{fill:#e9f7f6;stroke:#08787b;stroke-width:2}.route{fill:#fff;stroke:#879699;stroke-width:1.5}.soft{fill:#f4f7f7;stroke:#bcc7c9;stroke-width:1.3}.dash{fill:#fff;stroke:#879699;stroke-width:1.5;stroke-dasharray:7 5}.gate{fill:#08787b;stroke:#066568;stroke-width:1.5}.label{fill:#172628;font-size:22px;font-weight:700}.smallLabel{fill:#172628;font-size:18px;font-weight:700}.copy{fill:#536164;font-size:16px}.tiny{fill:#627174;font-size:14px}.routeName{fill:#08787b;font-size:22px;font-weight:800;letter-spacing:.8px}.gateText{fill:#fff;font-size:18px;font-weight:750}.flow{fill:none;stroke:#59696b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.branch{fill:none;stroke:#59696b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.badge{fill:#eef6f5;stroke:#8eb6b5;stroke-width:1}.badgeText{fill:#255c60;font-size:14px;font-weight:800;letter-spacing:.4px}
    </style>
  </defs>
  <rect width="1280" height="1200" fill="#fbfcfc"/><rect width="1280" height="1200" fill="url(#grid)"/>

  <rect x="414" y="24" width="452" height="34" rx="17" class="badge"/>
  <text x="640" y="47" class="badgeText" text-anchor="middle">CODEX V2 · LOCAL V1.0.26 BUILD · NOT PUBLISHED</text>

  <g><rect x="530" y="82" width="220" height="60" rx="9" class="card teal"/><text x="640" y="120" class="label" text-anchor="middle">Request</text></g>
  <path d="M640 142V176" class="flow"/>
  <g>
    <rect x="330" y="176" width="620" height="92" rx="9" class="card"/>
    <text x="640" y="211" class="label" text-anchor="middle">Choose one work route</text>
    <text x="640" y="239" class="copy" text-anchor="middle">path=auto: analyze and select · explicit path: validate the exact route</text>
    <text x="640" y="258" class="tiny" text-anchor="middle">Invalid, conflicting, or unusable explicit paths fail closed</text>
  </g>

  <path d="M640 268V300H220V330" class="branch"/><path d="M640 300V330" class="flow"/><path d="M640 300H1060V330" class="flow"/><path d="M220 300V330" class="flow"/>

  <!-- DIRECT -->
  <g>
    <rect x="48" y="330" width="344" height="460" rx="12" class="route"/>
    <text x="220" y="370" class="routeName" text-anchor="middle">DIRECT</text>
    <text x="220" y="398" class="copy" text-anchor="middle">Bounded work · known checks</text>
    <rect x="82" y="430" width="276" height="74" rx="8" class="soft"/>
    <text x="220" y="460" class="smallLabel" text-anchor="middle">Success card</text>
    <text x="220" y="485" class="copy" text-anchor="middle">No short plan or roadmap</text>
    <path d="M220 504V536" class="flow"/>
    <rect x="82" y="536" width="276" height="74" rx="8" class="card"/>
    <text x="220" y="567" class="smallLabel" text-anchor="middle">Produce work</text>
    <text x="220" y="592" class="copy" text-anchor="middle">1–2 workers normally</text>
    <path d="M220 610V642" class="flow"/>
    <rect x="82" y="642" width="276" height="74" rx="8" class="card teal"/>
    <text x="220" y="673" class="smallLabel" text-anchor="middle">Freeze version</text>
    <text x="220" y="698" class="copy" text-anchor="middle">Bind checks to exact output</text>
  </g>

  <!-- LIGHT -->
  <g>
    <rect x="468" y="330" width="344" height="460" rx="12" class="route"/>
    <text x="640" y="370" class="routeName" text-anchor="middle">LIGHT</text>
    <text x="640" y="398" class="copy" text-anchor="middle">Short reversible uncertainty</text>
    <rect x="502" y="430" width="276" height="74" rx="8" class="soft"/>
    <text x="640" y="460" class="smallLabel" text-anchor="middle">Success card + short plan</text>
    <text x="640" y="485" class="copy" text-anchor="middle">Up to 5 minutes · 15 bullets</text>
    <path d="M640 504V536" class="flow"/>
    <rect x="502" y="536" width="276" height="74" rx="8" class="card"/>
    <text x="640" y="567" class="smallLabel" text-anchor="middle">Produce work</text>
    <text x="640" y="592" class="copy" text-anchor="middle">Workers derived from plan</text>
    <path d="M640 610V642" class="flow"/>
    <rect x="502" y="642" width="276" height="74" rx="8" class="card teal"/>
    <text x="640" y="673" class="smallLabel" text-anchor="middle">Freeze version</text>
    <text x="640" y="698" class="copy" text-anchor="middle">Bind checks to exact output</text>
  </g>

  <!-- ROADMAP -->
  <g>
    <rect x="888" y="330" width="344" height="460" rx="12" class="route"/>
    <text x="1060" y="370" class="routeName" text-anchor="middle">ROADMAP</text>
    <text x="1060" y="398" class="copy" text-anchor="middle">Dependencies · architecture · staged risk</text>
    <rect x="922" y="420" width="276" height="84" rx="8" class="soft"/>
    <text x="1060" y="451" class="smallLabel" text-anchor="middle">Scope + executable roadmap</text>
    <text x="1060" y="476" class="copy" text-anchor="middle">Independent plan check</text>
    <path d="M1060 504V526" class="flow"/>
    <rect x="922" y="526" width="276" height="84" rx="8" class="card"/>
    <text x="1060" y="557" class="smallLabel" text-anchor="middle">Coordinate + produce</text>
    <text x="1060" y="582" class="copy" text-anchor="middle">Integrate dependent work</text>
    <path d="M1060 610V642" class="flow"/>
    <rect x="922" y="642" width="276" height="74" rx="8" class="card teal"/>
    <text x="1060" y="673" class="smallLabel" text-anchor="middle">Freeze version</text>
    <text x="1060" y="698" class="copy" text-anchor="middle">Bind checks to exact output</text>
  </g>

  <path d="M220 716V820H640" class="branch"/><path d="M640 716V820" class="flow"/><path d="M1060 716V820H640" class="flow"/>
  <g>
    <rect x="350" y="820" width="580" height="112" rx="10" class="dash"/>
    <text x="640" y="857" class="label" text-anchor="middle">Risk-aware independent review + testing</text>
    <text x="640" y="886" class="copy" text-anchor="middle">One combined checker by default</text>
    <text x="640" y="912" class="copy" text-anchor="middle">A second checker requires a named, distinct risk responsibility</text>
  </g>
  <path d="M640 932V968" class="flow"/>
  <g><rect x="408" y="968" width="464" height="74" rx="9" class="card teal"/><text x="640" y="999" class="smallLabel" text-anchor="middle">Join findings + final record</text><text x="640" y="1025" class="copy" text-anchor="middle">Open findings loop to their owning route step</text></g>
  <path d="M640 1042V1076" class="flow"/>
  <rect x="545" y="1076" width="190" height="58" rx="29" class="gate"/><text x="640" y="1113" class="gateText" text-anchor="middle">Done</text>
  <text x="640" y="1170" class="tiny" text-anchor="middle">A route changes only when recorded facts justify the change before production write.</text>
</svg>
