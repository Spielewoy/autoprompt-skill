<svg xmlns="http://www.w3.org/2000/svg" width="2128" height="590" viewBox="0 0 2128 590" role="img" aria-labelledby="title desc" data-release-status="local-v1.0.25-build-not-published">
  <title id="title">Anatomy of an Autoprompt invocation</title>
  <desc id="desc">Two separate, copyable Autoprompt invocation forms: slash-command providers without path, and the local, not-published Codex v1.0.25 launcher with path first in the quoted request.</desc>
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#e2e2e4" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="2128" height="590" fill="#fbfbfa"/>
  <rect width="2128" height="590" fill="url(#grid)" opacity=".78"/>

  <!-- Single flat anatomy panel -->
  <g transform="translate(0 -244)">
  <rect x="80" y="304" width="1968" height="470" rx="14" fill="#ffffff" stroke="#c9c9ce" stroke-width="1.5"/>
  <line x1="80" y1="440" x2="2048" y2="440" stroke="#d6d6da" stroke-width="1"/>
  <line x1="408" y1="440" x2="408" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="736" y1="440" x2="736" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="1064" y1="440" x2="1064" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="1392" y1="440" x2="1392" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="1720" y1="440" x2="1720" y2="774" stroke="#d6d6da" stroke-width="1"/>

  <!-- Provider-specific, copyable command rows. Keep path out of the slash-command form. -->
  <text x="112" y="329" fill="#255C60" font-family="Nimbus Sans, Arial, sans-serif" font-size="14" font-weight="700">SLASH-COMMAND PROVIDERS (NOT CODEX V2)</text>
  <text x="112" y="360" fill="#0d0d0f" font-family="Nimbus Mono PS, monospace" font-size="20">/autoprompt mode=wide max_subs=100 agents=auto &lt;your goal&gt;</text>
  <text x="112" y="389" fill="#255C60" font-family="Nimbus Sans, Arial, sans-serif" font-size="14" font-weight="700">CODEX V2 · LOCAL V1.0.25 BUILD · NOT PUBLISHED</text>
  <text x="112" y="420" fill="#0d0d0f" font-family="Nimbus Mono PS, monospace" font-size="20">autoprompt activate codex -- "path=auto mode=wide max_subs=100 agents=auto &lt;your goal&gt;"</text>

  <!-- Column 01 -->
  <text x="112" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">01</text>
  <text x="112" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600">Trigger</text>
  <text x="112" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="112" dy="0">Loads the skill</tspan>
    <tspan x="112" dy="30">and starts the run.</tspan>
  </text>

  <!-- Column 02 -->
  <text x="440" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">02</text>
  <text x="440" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600">Concurrency</text>
  <text x="440" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="440" dy="0">How many agents</tspan>
    <tspan x="440" dy="30">run at once.</tspan>
  </text>
  <text x="440" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13">
    <tspan x="440" dy="0">tokensaver / wide</tspan>
    <tspan x="440" dy="24">/ custom</tspan>
  </text>

  <!-- Column 03 -->
  <text x="768" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">03</text>
  <text x="768" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600">Agent cap</text>
  <text x="768" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="768" dy="0">Maximum agents</tspan>
    <tspan x="768" dy="30">live at once.</tspan>
  </text>
  <text x="768" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13">varies by harness</text>

  <!-- Column 04 -->
  <text x="1096" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">04</text>
  <text x="1096" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600">Models</text>
  <text x="1096" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="1096" dy="0">Chooses the</tspan>
    <tspan x="1096" dy="30">agent pool.</tspan>
  </text>
  <text x="1096" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13">
    <tspan x="1096" dy="0">off / auto</tspan>
    <tspan x="1096" dy="24">/ explicit list</tspan>
  </text>

  <!-- Column 05 -->
  <text x="1424" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">05</text>
  <text x="1424" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600">Goal</text>
  <text x="1424" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="1424" dy="0">Plain words</tspan>
    <tspan x="1424" dy="30">are enough.</tspan>
  </text>
  <text x="1424" y="694" fill="#75757c" font-family="Nimbus Sans, Arial, sans-serif" font-size="15">
    <tspan x="1424" dy="0">Describe the result</tspan>
    <tspan x="1424" dy="24">you want.</tspan>
  </text>

  <!-- Column 06: local Codex v1.0.25 build, not published -->
  <text x="1752" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">06</text>
  <text x="1752" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="25" font-weight="600">Path — Codex v2 only</text>
  <text x="1752" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="1752" dy="0">First in the quoted</tspan>
    <tspan x="1752" dy="30">request. Local only.</tspan>
  </text>
  <text x="1752" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13">
    <tspan x="1752" dy="0">auto / direct / light</tspan>
    <tspan x="1752" dy="24">/ roadmap</tspan>
  </text>

  </g>
</svg>
