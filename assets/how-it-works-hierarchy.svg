<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc" data-release-status="local-v1.0.29-build-not-published">
  <title id="title">Codex v2 route-aware agent hierarchy</title>
  <desc id="desc">The local, not-published Codex v1.0.29 build uses a shallow hierarchy for DIRECT and LIGHT, and admits coordinators and an optional manager only for ROADMAP work.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e7ebeb" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59696b"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans",sans-serif}.card{fill:#fff;stroke:#aab5b7;stroke-width:1.5}.teal{fill:#e9f7f6;stroke:#08787b;stroke-width:2}.lane{fill:#fff;stroke:#879699;stroke-width:1.5}.soft{fill:#f4f7f7;stroke:#bcc7c9;stroke-width:1.3}.optional{fill:#fff;stroke:#879699;stroke-width:1.5;stroke-dasharray:7 5}.label{fill:#172628;font-size:22px;font-weight:700}.smallLabel{fill:#172628;font-size:18px;font-weight:700}.copy{fill:#536164;font-size:16px}.tiny{fill:#627174;font-size:14px}.routeName{fill:#08787b;font-size:23px;font-weight:800;letter-spacing:.8px}.level{fill:#255c60;font-size:14px;font-weight:800}.role{fill:#334548;font-size:16px;font-weight:600}.flow{fill:none;stroke:#59696b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.branch{fill:none;stroke:#59696b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.badge{fill:#eef6f5;stroke:#8eb6b5;stroke-width:1}.badgeText{fill:#255c60;font-size:14px;font-weight:800;letter-spacing:.4px}
    </style>
  </defs>
  <rect width="1440" height="1080" fill="#fbfcfc"/><rect width="1440" height="1080" fill="url(#grid)"/>

  <rect x="494" y="22" width="452" height="34" rx="17" class="badge"/><text x="720" y="45" class="badgeText" text-anchor="middle">CODEX V2 · LOCAL V1.0.29 BUILD · NOT PUBLISHED</text>
  <g><rect x="610" y="82" width="220" height="58" rx="9" class="card teal"/><text x="720" y="119" class="label" text-anchor="middle">Request</text></g>
  <path d="M720 140V174" class="flow"/>
  <g>
    <rect x="404" y="174" width="632" height="92" rx="9" class="card"/>
    <text x="720" y="208" class="label" text-anchor="middle">L0 run control + route decision</text>
    <text x="720" y="236" class="copy" text-anchor="middle">Automatic: route analyst + run coordinator · Explicit: validate requested route</text>
    <text x="720" y="256" class="tiny" text-anchor="middle">Preflight, safety, authority, and route recording remain required</text>
  </g>
  <path d="M720 266V302H240V334" class="branch"/><path d="M720 302V334" class="flow"/><path d="M720 302H1200V334" class="flow"/><path d="M240 302V334" class="flow"/>

  <!-- DIRECT topology -->
  <g>
    <rect x="42" y="334" width="396" height="582" rx="12" class="lane"/>
    <text x="240" y="376" class="routeName" text-anchor="middle">DIRECT</text>
    <text x="240" y="404" class="copy" text-anchor="middle">Shallow topology · no L1 or L2</text>
    <rect x="78" y="442" width="324" height="78" rx="8" class="soft"/>
    <text x="100" y="469" class="level">L0</text><text x="240" y="476" class="smallLabel" text-anchor="middle">Run coordinator</text>
    <text x="240" y="501" class="tiny" text-anchor="middle">Owns success card and handoffs</text>
    <path d="M240 520V558" class="flow"/>
    <rect x="78" y="558" width="324" height="96" rx="8" class="card"/>
    <text x="100" y="585" class="level">L3</text><text x="240" y="592" class="smallLabel" text-anchor="middle">Worker work item</text>
    <text x="240" y="618" class="role" text-anchor="middle">1–2 workers normally</text>
    <text x="240" y="640" class="tiny" text-anchor="middle">3 only for separate work</text>
    <path d="M240 654V692" class="flow"/>
    <rect x="78" y="692" width="324" height="100" rx="8" class="card teal"/>
    <text x="100" y="719" class="level">L4</text><text x="240" y="726" class="smallLabel" text-anchor="middle">Independent check</text>
    <text x="240" y="752" class="role" text-anchor="middle">One combined checker by default</text>
    <text x="240" y="776" class="tiny" text-anchor="middle">Review + real behavior check</text>
  </g>

  <!-- LIGHT topology -->
  <g>
    <rect x="522" y="334" width="396" height="582" rx="12" class="lane"/>
    <text x="720" y="376" class="routeName" text-anchor="middle">LIGHT</text>
    <text x="720" y="404" class="copy" text-anchor="middle">Short planning · no L1 or L2</text>
    <rect x="558" y="442" width="324" height="78" rx="8" class="soft"/>
    <text x="580" y="469" class="level">L0</text><text x="720" y="476" class="smallLabel" text-anchor="middle">Run coordinator</text>
    <text x="720" y="501" class="tiny" text-anchor="middle">Owns success card and handoffs</text>
    <path d="M720 520V548" class="flow"/>
    <rect x="558" y="548" width="324" height="116" rx="8" class="card"/>
    <text x="580" y="575" class="level">L3</text><text x="720" y="582" class="smallLabel" text-anchor="middle">Plan + worker lanes</text>
    <text x="720" y="608" class="role" text-anchor="middle">Short planner</text>
    <text x="720" y="632" class="role" text-anchor="middle">Workers derived from plan</text>
    <text x="720" y="654" class="tiny" text-anchor="middle">No coordinator or manager</text>
    <path d="M720 664V692" class="flow"/>
    <rect x="558" y="692" width="324" height="100" rx="8" class="card teal"/>
    <text x="580" y="719" class="level">L4</text><text x="720" y="726" class="smallLabel" text-anchor="middle">Independent check</text>
    <text x="720" y="752" class="role" text-anchor="middle">One combined checker by default</text>
    <text x="720" y="776" class="tiny" text-anchor="middle">Second only for a named risk</text>
  </g>

  <!-- ROADMAP topology -->
  <g>
    <rect x="1002" y="334" width="396" height="582" rx="12" class="lane"/>
    <text x="1200" y="376" class="routeName" text-anchor="middle">ROADMAP</text>
    <text x="1200" y="404" class="copy" text-anchor="middle">Coordinated topology when justified</text>
    <rect x="1038" y="430" width="324" height="90" rx="8" class="soft"/>
    <text x="1060" y="457" class="level">L1</text><text x="1200" y="464" class="smallLabel" text-anchor="middle">Coordinators</text>
    <text x="1200" y="490" class="role" text-anchor="middle">Scope · feature · final review</text>
    <text x="1200" y="511" class="tiny" text-anchor="middle">Admitted only on ROADMAP</text>
    <path d="M1200 520V544" class="flow"/>
    <rect x="1038" y="544" width="324" height="76" rx="8" class="optional"/>
    <text x="1060" y="571" class="level">L2</text><text x="1200" y="578" class="smallLabel" text-anchor="middle">Manager, if admitted</text>
    <text x="1200" y="603" class="tiny" text-anchor="middle">Multi-worker or persistent context need</text>
    <path d="M1200 620V644" class="flow"/>
    <rect x="1038" y="644" width="324" height="94" rx="8" class="card"/>
    <text x="1060" y="671" class="level">L3</text><text x="1200" y="678" class="smallLabel" text-anchor="middle">Execution lanes</text>
    <text x="1200" y="704" class="role" text-anchor="middle">Scope + roadmap · build · integrate</text>
    <text x="1200" y="726" class="tiny" text-anchor="middle">Owned dependent work groups</text>
    <path d="M1200 738V762" class="flow"/>
    <rect x="1038" y="762" width="324" height="108" rx="8" class="card teal"/>
    <text x="1060" y="789" class="level">L4</text><text x="1200" y="796" class="smallLabel" text-anchor="middle">Independent checks</text>
    <text x="1200" y="822" class="role" text-anchor="middle">Plan check · work check</text>
    <text x="1200" y="846" class="role" text-anchor="middle">Goal check + final review</text>
    <text x="1200" y="866" class="tiny" text-anchor="middle">Extra checker only for a named risk</text>
  </g>

  <path d="M240 792V960H720" class="branch"/><path d="M720 792V960" class="flow"/><path d="M1200 870V960H720" class="flow"/>
  <g><rect x="400" y="960" width="640" height="82" rx="10" class="card teal"/><text x="720" y="993" class="label" text-anchor="middle">Shared completion boundary</text><text x="720" y="1021" class="copy" text-anchor="middle">Frozen output · joined findings · final record · no open required work</text></g>
  <text x="720" y="1064" class="tiny" text-anchor="middle">Route choice changes which layers exist; it does not remove safety, authority, execution, or independent checking.</text>
</svg>
