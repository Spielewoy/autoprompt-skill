<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1580" viewBox="0 0 1280 1580" role="img" aria-labelledby="title desc">
  <title id="title">Cómo funciona Autoprompt</title><desc id="desc">El prompt pasa por alcance, controles independientes de la hoja de ruta, un plan detallado opcional, implementación, revisión y verificación en paralelo, y convergencia final.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e7ebeb" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59696b"/></marker><marker id="retryArrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#08787b"/></marker>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans","Microsoft YaHei","Malgun Gothic","Noto Sans Arabic",sans-serif}.card{fill:#fff;stroke:#aab5b7;stroke-width:1.5}.teal{fill:#e9f7f6;stroke:#08787b;stroke-width:2}.optional{fill:#fff;stroke:#839194;stroke-width:1.5;stroke-dasharray:7 5}.gate{fill:#08787b;stroke:#066568;stroke-width:1.5}.decision{fill:#f5f7f7;stroke:#59696b;stroke-width:1.5}.label{fill:#172628;font-size:21px;font-weight:650}.label.small{font-size:18px}.copy{fill:#536164;font-size:18px;font-weight:450}.gateText{fill:#fff;font-size:17px;font-weight:700}.phase{fill:#5e6c6f;font-size:17px;font-weight:700;letter-spacing:.4px}.layerBracket{stroke:#9db0b2;stroke-width:2.5;stroke-linecap:square;stroke-linejoin:miter}.badge{fill:#eef2f2;stroke:#c4cdce}.badgeText{fill:#415053;font-size:15px;font-weight:700}.flow{fill:none;stroke:#59696b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.branch{fill:none;stroke:#59696b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.retry{fill:none;stroke:#08787b;stroke-width:2;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#retryArrow)}.retryText{fill:#08787b;font-size:16px;font-weight:650}.choice{fill:#415053;font-size:16px;font-weight:700}</style></defs>
  <rect width="1280" height="1580" fill="#fbfcfc"/><rect width="1280" height="1580" fill="url(#grid)"/>
  <g aria-hidden="true">
    <path d="M58 118H32V902H58" fill="none" class="layerBracket"/><text x="18" y="503" class="phase" text-anchor="middle" transform="rotate(-90 18 503)">Planificar</text>
    <path d="M58 902H32V1004H58" fill="none" class="layerBracket"/><text x="18" y="959" class="phase" text-anchor="middle" transform="rotate(-90 18 959)">Construir</text>
    <path d="M58 1038H32V1450H58" fill="none" class="layerBracket"/><text x="18" y="1244" class="phase" text-anchor="middle" transform="rotate(-90 18 1244)">Comprobaciones finales</text>
  </g>
  <g><rect x="540" y="32" width="200" height="60" rx="8" class="card teal"/><text x="640" y="69" class="label" text-anchor="middle">Prompt</text></g>
  <path d="M640 92 L640 120" class="flow"/><g><rect x="440" y="120" width="400" height="80" rx="8" class="card"/><text x="640" y="153" class="label" text-anchor="middle">Alcance</text><text x="640" y="181" class="copy" text-anchor="middle">Delimita el trabajo pedido</text></g>
  <path d="M640 200 L640 236" class="flow"/><g><rect x="420" y="236" width="440" height="82" rx="8" class="card"/><text x="640" y="270" class="label" text-anchor="middle">Hoja de ruta ejecutable</text><text x="640" y="298" class="copy" text-anchor="middle">Tareas, responsables, dependencias y controles</text></g>
  <path d="M640 318 L640 344 L400 344 L400 364" class="branch"/><path d="M640 344 L880 344 L880 364" class="flow"/><path d="M400 344 L400 364" class="flow"/>
  <g><rect x="220" y="364" width="360" height="86" rx="8" class="card teal"/><text x="400" y="400" class="label small" text-anchor="middle">Revisión de la hoja de ruta</text><text x="400" y="428" class="copy" text-anchor="middle">Revisor independiente</text></g><g><rect x="700" y="364" width="360" height="86" rx="8" class="card teal"/><text x="880" y="400" class="label small" text-anchor="middle">Verificación independiente a ciegas</text><text x="880" y="428" class="copy" text-anchor="middle">Comprueba el prompt y el repositorio</text></g>
  <path d="M400 450 L400 474 L640 474" class="branch"/><path d="M880 450 L880 474 L640 474 L640 490" class="flow"/>
  <rect x="510" y="490" width="260" height="54" rx="27" class="gate"/><text x="640" y="524" class="gateText" text-anchor="middle">Ambos aprueban</text>
  <path d="M640 544 L640 580" class="flow"/><rect x="440" y="580" width="400" height="66" rx="8" class="decision"/><text x="640" y="621" class="label small" text-anchor="middle">¿Hace falta un plan detallado?</text>
  <path d="M640 646 L640 684" class="flow"/><text x="666" y="674" class="choice" text-anchor="start">Sí</text><g><rect x="440" y="684" width="400" height="78" rx="8" class="card optional"/><text x="640" y="716" class="label" text-anchor="middle">Plan detallado</text><text x="640" y="744" class="copy" text-anchor="middle">Solo cuando es necesario</text></g>
  <path d="M840 613 L1080 613 L1080 952 L840 952" class="flow"/><text x="1056" y="604" class="choice" text-anchor="end">No</text>
  <path d="M640 762 L640 786 L400 786 L400 806" class="branch"/><path d="M640 786 L880 786 L880 806" class="flow"/><path d="M400 786 L400 806" class="flow"/>
  <g><rect x="220" y="806" width="360" height="82" rx="8" class="card teal"/><text x="400" y="840" class="label small" text-anchor="middle">Revisión del plan</text><text x="400" y="868" class="copy" text-anchor="middle">Comprobación independiente</text></g><g><rect x="700" y="806" width="360" height="82" rx="8" class="card teal"/><text x="880" y="840" class="label small" text-anchor="middle">Nueva revisión del plan</text><text x="880" y="868" class="copy" text-anchor="middle">Verificación a ciegas</text></g>
  <path d="M400 888 L400 912 L640 912" class="branch"/><path d="M880 888 L880 912 L640 912 L640 924" class="flow"/>
  <g><rect x="440" y="924" width="400" height="80" rx="8" class="card"/><text x="640" y="957" class="label" text-anchor="middle">Implementar</text><text x="640" y="985" class="copy" text-anchor="middle">Primero pruebas, luego código</text></g>
  <path d="M640 1004 L640 1028 L400 1028 L400 1050" class="branch"/><path d="M640 1028 L880 1028 L880 1050" class="flow"/><path d="M400 1028 L400 1050" class="flow"/>
  <g><rect x="220" y="1050" width="360" height="84" rx="8" class="card teal"/><text x="400" y="1085" class="label small" text-anchor="middle">Revisión de la implementación</text><text x="400" y="1113" class="copy" text-anchor="middle">Comprueba el diff</text></g><g><rect x="700" y="1050" width="360" height="84" rx="8" class="card teal"/><text x="880" y="1085" class="label small" text-anchor="middle">Pruebas + verificación</text><text x="880" y="1113" class="copy" text-anchor="middle">Ejecuta las comprobaciones reales</text></g>
  <path d="M400 1134 L400 1158 L640 1158" class="branch"/><path d="M880 1134 L880 1158 L640 1158 L640 1174" class="flow"/>
  <rect x="510" y="1174" width="260" height="54" rx="27" class="gate"/><text x="640" y="1208" class="gateText" text-anchor="middle">Ambos pasan</text>
  <path d="M640 1228 L640 1264" class="flow"/><g><rect x="440" y="1264" width="400" height="72" rx="8" class="card optional"/><text x="640" y="1293" class="label" text-anchor="middle">Aprobación independiente</text><text x="640" y="1321" class="copy" text-anchor="middle">Cuando sea necesaria</text></g>
  <path d="M640 1336 L640 1370" class="flow"/><g><rect x="420" y="1370" width="440" height="80" rx="8" class="card teal"/><text x="640" y="1403" class="label small" text-anchor="middle">Revisión final + objetivo</text><text x="640" y="1431" class="copy" text-anchor="middle">Sin peticiones ni hallazgos pendientes</text></g>
  <path d="M640 1450 L640 1486" class="flow"/><rect x="540" y="1486" width="200" height="58" rx="29" class="gate"/><text x="640" y="1523" class="gateText" text-anchor="middle">Hecho</text>
    <path d="M220 407 L142 407 L142 277 L420 277" class="retry"/><rect x="48" y="367" width="170" height="30" rx="5" fill="#fbfcfc"/><text x="133" y="388" class="retryText" text-anchor="middle">Falta en la hoja de ruta</text>
    <path d="M220 847 L112 847 L112 723 L440 723" class="retry"/><rect x="48" y="807" width="170" height="30" rx="5" fill="#fbfcfc"/><text x="133" y="828" class="retryText" text-anchor="middle">Falta en el plan</text>
    <path d="M1060 1092 L1160 1092 L1160 964 L840 964" class="retry"/><rect x="1062" y="1047" width="170" height="30" rx="5" fill="#fbfcfc"/><text x="1147" y="1068" class="retryText" text-anchor="middle">Hallazgo local</text>
</svg>
