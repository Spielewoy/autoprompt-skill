<svg xmlns="http://www.w3.org/2000/svg" width="2128" height="590" viewBox="0 0 2128 590" role="img" aria-labelledby="title desc" data-release-status="local-v1.0.13-build-not-published">
  <title id="title">بنية استدعاء Autoprompt</title>
  <desc id="desc">صيغتان منفصلتان وقابلتان للنسخ لاستدعاء Autoprompt: صيغة موفري أمر الشرطة المائلة بلا path، ومشغّل Codex v1.0.13 المحلي غير المنشور مع path أولا داخل الطلب المقتبس.</desc>
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#e2e2e4" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="2128" height="590" fill="#fbfbfa"/>
  <rect width="2128" height="590" fill="url(#grid)" opacity=".78"/>

  <g transform="translate(0 -244)">

  <!-- Single flat anatomy panel -->
  <rect x="80" y="304" width="1968" height="470" rx="14" fill="#ffffff" stroke="#c9c9ce" stroke-width="1.5"/>
  <line x1="80" y1="440" x2="2048" y2="440" stroke="#d6d6da" stroke-width="1"/>
  <line x1="408" y1="440" x2="408" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="736" y1="440" x2="736" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="1064" y1="440" x2="1064" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="1392" y1="440" x2="1392" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="1720" y1="440" x2="1720" y2="774" stroke="#d6d6da" stroke-width="1"/>

  <text x="112" y="329" fill="#255C60" font-family="Nimbus Sans, Arial, sans-serif" font-size="14" font-weight="700" direction="rtl" unicode-bidi="isolate">موفرو أمر الشرطة المائلة (ليس CODEX V2)</text>
  <text x="112" y="360" fill="#0d0d0f" font-family="Nimbus Mono PS, monospace" font-size="20">/autoprompt mode=wide max_subs=100 agents=auto &lt;هدفك&gt;</text>
  <text x="112" y="389" fill="#255C60" font-family="Nimbus Sans, Arial, sans-serif" font-size="14" font-weight="700" direction="rtl" unicode-bidi="isolate">CODEX V2 · إصدار V1.0.13 محلي · غير منشور</text>
  <text x="112" y="420" fill="#0d0d0f" font-family="Nimbus Mono PS, monospace" font-size="20">autoprompt activate codex -- "path=auto mode=wide max_subs=100 agents=auto &lt;هدفك&gt;"</text>

  <!-- Column 01 -->
  <text x="112" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">01</text>
  <text x="112" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600" direction="rtl" unicode-bidi="isolate" text-anchor="end">التفعيل</text>
  <text x="112" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="112" dy="0" direction="rtl" unicode-bidi="isolate" text-anchor="end">يحمّل Autoprompt</tspan>
    <tspan x="112" dy="30" direction="rtl" unicode-bidi="isolate" text-anchor="end">ويبدأ التشغيل.</tspan>
  </text>

  <!-- Column 02 -->
  <text x="440" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">02</text>
  <text x="440" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600" direction="rtl" unicode-bidi="isolate" text-anchor="end">التوازي</text>
  <text x="440" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="440" dy="0" direction="rtl" unicode-bidi="isolate" text-anchor="end">عدد الوكلاء</tspan>
    <tspan x="440" dy="30" direction="rtl" unicode-bidi="isolate" text-anchor="end">الذين يعملون معا.</tspan>
  </text>
  <text x="440" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13">
    <tspan x="440" dy="0">tokensaver / wide</tspan>
    <tspan x="440" dy="24">/ custom</tspan>
  </text>

  <!-- Column 03 -->
  <text x="768" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">03</text>
  <text x="768" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600" direction="rtl" unicode-bidi="isolate" text-anchor="end">حد الوكلاء</text>
  <text x="768" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="768" dy="0" direction="rtl" unicode-bidi="isolate" text-anchor="end">أقصى عدد من الوكلاء</tspan>
    <tspan x="768" dy="30" direction="rtl" unicode-bidi="isolate" text-anchor="end">النشطين معا.</tspan>
  </text>
  <text x="768" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13" direction="rtl" unicode-bidi="isolate" text-anchor="end">يختلف حسب المضيف</text>

  <!-- Column 04 -->
  <text x="1096" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">04</text>
  <text x="1096" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600" direction="rtl" unicode-bidi="isolate" text-anchor="end">النماذج</text>
  <text x="1096" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="1096" dy="0" direction="rtl" unicode-bidi="isolate" text-anchor="end">يحدد مجموعة</tspan>
    <tspan x="1096" dy="30" direction="rtl" unicode-bidi="isolate" text-anchor="end">الوكلاء.</tspan>
  </text>
  <text x="1096" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13">
    <tspan x="1096" dy="0">off / auto</tspan>
    <tspan x="1096" dy="24" direction="rtl" unicode-bidi="isolate" text-anchor="end">/ قائمة محددة</tspan>
  </text>

  <!-- Column 05 -->
  <text x="1424" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">05</text>
  <text x="1424" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600" direction="rtl" unicode-bidi="isolate" text-anchor="end">الهدف</text>
  <text x="1424" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="1424" dy="0" direction="rtl" unicode-bidi="isolate" text-anchor="end">تكفي</tspan>
    <tspan x="1424" dy="30" direction="rtl" unicode-bidi="isolate" text-anchor="end">كلمات واضحة.</tspan>
  </text>
  <text x="1424" y="694" fill="#75757c" font-family="Nimbus Sans, Arial, sans-serif" font-size="15">
    <tspan x="1424" dy="0" direction="rtl" unicode-bidi="isolate" text-anchor="end">صف النتيجة</tspan>
    <tspan x="1424" dy="24" direction="rtl" unicode-bidi="isolate" text-anchor="end">التي تريدها.</tspan>
  </text>

  <!-- Column 06: local Codex v1.0.13 build, not published -->
  <text x="1752" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">06</text>
  <text x="1752" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="23" font-weight="600" direction="rtl" unicode-bidi="isolate" text-anchor="end">المسار — Codex v2 فقط</text>
  <text x="1752" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="1752" dy="0" direction="rtl" unicode-bidi="isolate" text-anchor="end">أولا داخل الطلب المقتبس.</tspan>
    <tspan x="1752" dy="30" direction="rtl" unicode-bidi="isolate" text-anchor="end">للإصدار المحلي فقط.</tspan>
  </text>
  <text x="1752" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13">
    <tspan x="1752" dy="0">auto / direct / light</tspan>
    <tspan x="1752" dy="24">/ roadmap</tspan>
  </text>

  </g>
</svg>
