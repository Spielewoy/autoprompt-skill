<svg xmlns="http://www.w3.org/2000/svg" width="2128" height="590" viewBox="0 0 2128 590" role="img" aria-labelledby="title desc" data-release-status="local-v1.0.30-build-not-published">
  <title id="title">Autoprompt 调用结构</title>
  <desc id="desc">两种彼此分离、可复制的 Autoprompt 调用形式：不支持 path 的斜杠命令提供方，以及把 path 放在引号内请求首位的未发布本地 Codex v1.0.30 启动器。</desc>
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#e2e2e4" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="2128" height="590" fill="#fbfbfa"/>
  <rect width="2128" height="590" fill="url(#grid)" opacity=".78"/>

  <!-- Single flat anatomy panel -->
  <g transform="translate(0 -244)">
  <rect x="80" y="304" width="1968" height="470" rx="14" fill="#ffffff" stroke="#c9c9ce" stroke-width="1.5"/>
  <line x1="80" y1="440" x2="2048" y2="440" stroke="#d6d6da" stroke-width="1"/>
  <line x1="408" y1="440" x2="408" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="736" y1="440" x2="736" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="1064" y1="440" x2="1064" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="1392" y1="440" x2="1392" y2="774" stroke="#d6d6da" stroke-width="1"/>
  <line x1="1720" y1="440" x2="1720" y2="774" stroke="#d6d6da" stroke-width="1"/>

  <text x="112" y="329" fill="#255C60" font-family="Nimbus Sans, Arial, sans-serif" font-size="14" font-weight="700">斜杠命令提供方（不含 CODEX V2）</text>
  <text x="112" y="360" fill="#0d0d0f" font-family="Nimbus Mono PS, monospace" font-size="20">/autoprompt mode=wide max_subs=100 agents=auto &lt;你的目标&gt;</text>
  <text x="112" y="389" fill="#255C60" font-family="Nimbus Sans, Arial, sans-serif" font-size="14" font-weight="700">CODEX V2 · 本地 V1.0.30 构建 · 尚未发布</text>
  <text x="112" y="420" fill="#0d0d0f" font-family="Nimbus Mono PS, monospace" font-size="20">autoprompt activate codex -- "path=auto mode=wide max_subs=100 agents=auto &lt;你的目标&gt;"</text>

  <!-- Column 01 -->
  <text x="112" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">01</text>
  <text x="112" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600">触发</text>
  <text x="112" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="112" dy="0">加载技能</tspan>
    <tspan x="112" dy="30">并启动运行。</tspan>
  </text>

  <!-- Column 02 -->
  <text x="440" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">02</text>
  <text x="440" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600">并发</text>
  <text x="440" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="440" dy="0">同时运行的</tspan>
    <tspan x="440" dy="30">智能体数量。</tspan>
  </text>
  <text x="440" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13">
    <tspan x="440" dy="0">tokensaver / wide</tspan>
    <tspan x="440" dy="24">/ custom</tspan>
  </text>

  <!-- Column 03 -->
  <text x="768" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">03</text>
  <text x="768" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600">智能体上限</text>
  <text x="768" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="768" dy="0">同时运行的</tspan>
    <tspan x="768" dy="30">智能体最大数量。</tspan>
  </text>
  <text x="768" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13">因运行环境而异</text>

  <!-- Column 04 -->
  <text x="1096" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">04</text>
  <text x="1096" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600">模型</text>
  <text x="1096" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="1096" dy="0">选择</tspan>
    <tspan x="1096" dy="30">智能体模型池。</tspan>
  </text>
  <text x="1096" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13">
    <tspan x="1096" dy="0">off / auto</tspan>
    <tspan x="1096" dy="24">/ 明确列表</tspan>
  </text>

  <!-- Column 05 -->
  <text x="1424" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">05</text>
  <text x="1424" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="600">目标</text>
  <text x="1424" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="1424" dy="0">自然语言</tspan>
    <tspan x="1424" dy="30">就足够。</tspan>
  </text>
  <text x="1424" y="694" fill="#75757c" font-family="Nimbus Sans, Arial, sans-serif" font-size="15">
    <tspan x="1424" dy="0">描述你想要的</tspan>
    <tspan x="1424" dy="24">最终结果。</tspan>
  </text>

  <!-- Column 06: local Codex v1.0.30 build, not published -->
  <text x="1752" y="462" fill="#67676e" font-family="Nimbus Mono PS, monospace" font-size="14">06</text>
  <text x="1752" y="515" fill="#111113" font-family="Nimbus Sans, Arial, sans-serif" font-size="24" font-weight="600">路径 — 仅限 Codex v2</text>
  <text x="1752" y="566" fill="#56565d" font-family="Nimbus Sans, Arial, sans-serif" font-size="18">
    <tspan x="1752" dy="0">置于引号内请求首位。</tspan>
    <tspan x="1752" dy="30">仅限本地构建。</tspan>
  </text>
  <text x="1752" y="694" fill="#75757c" font-family="Nimbus Mono PS, monospace" font-size="13">
    <tspan x="1752" dy="0">auto / direct / light</tspan>
    <tspan x="1752" dy="24">/ roadmap</tspan>
  </text>

  </g>
</svg>
