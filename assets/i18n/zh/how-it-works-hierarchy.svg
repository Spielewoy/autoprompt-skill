<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Autoprompt 智能体层级</title><desc id="desc">25 个 Autoprompt 智能体角色按总协调者、协调者、按需管理者、执行线路和独立检查组织。</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e7ebeb" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59696b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans","Microsoft YaHei","Malgun Gothic","Noto Sans Arabic",sans-serif}.card,.lane{fill:#fff;stroke:#aab5b7;stroke-width:1.5}.teal{fill:#e9f7f6;stroke:#08787b;stroke-width:2}.optional{fill:#fff;stroke:#839194;stroke-width:1.5;stroke-dasharray:7 5}.label{fill:#172628;font-size:22px;font-weight:650}.copy{fill:#536164;font-size:16px}.laneTitle{fill:#172628;font-size:20px;font-weight:700}.role{fill:#2f3f42;font-size:17px;font-weight:520}.divider{stroke:#d5dddd;stroke-width:1}.flow{fill:none;stroke:#59696b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.branch{fill:none;stroke:#59696b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.layer{fill:#08787b;font-size:16px;font-weight:750}.layerLine{stroke:#9db0b2;stroke-width:1.5}</style></defs>
  <rect width="1440" height="980" fill="#fbfcfc"/><rect width="1440" height="980" fill="url(#grid)"/>
  <g><rect x="570" y="28" width="300" height="68" rx="8" class="card teal"/><text x="720" y="55" class="label" text-anchor="middle">提示词</text><text x="720" y="83" class="copy" text-anchor="middle">用户启动运行</text></g><path d="M720 96 L720 132" class="flow"/><g><rect x="480" y="132" width="480" height="88" rx="8" class="card"/><text x="720" y="169" class="label" text-anchor="middle">总协调者</text><text x="720" y="197" class="copy" text-anchor="middle">分派各阶段 · 返回最终状态</text></g>
  <path d="M720 220 L720 252 L245 252 L245 280" class="branch"/><path d="M720 252 L720 280" class="flow"/><path d="M720 252 L1195 252 L1195 280" class="flow"/><path d="M245 252 L245 280" class="flow"/>
  <g><rect x="55" y="280" width="380" height="104" rx="8" class="card"/><text x="245" y="325" class="label small" text-anchor="middle">范围协调者</text><text x="245" y="353" class="copy" text-anchor="middle">路线图编写者和审查者</text></g><g><rect x="530" y="280" width="380" height="104" rx="8" class="card"/><text x="720" y="325" class="label small" text-anchor="middle">功能协调者</text><text x="720" y="353" class="copy" text-anchor="middle">构建、审查和测试线路</text></g><g><rect x="1005" y="280" width="380" height="104" rx="8" class="card"/><text x="1195" y="325" class="label small" text-anchor="middle">收尾协调者</text><text x="1195" y="353" class="copy" text-anchor="middle">全面检查、目标核验与清理</text></g>
  <text x="245" y="376" class="role" text-anchor="middle" style="font-size:13px;fill:#667477">ap-scope-coordinator</text><text x="720" y="376" class="role" text-anchor="middle" style="font-size:13px;fill:#667477">ap-feature-coordinator</text><text x="1195" y="376" class="role" text-anchor="middle" style="font-size:13px;fill:#667477">ap-sweep-coordinator</text>
  <path d="M720 384 L720 426" class="flow"/><g><rect x="430" y="426" width="580" height="82" rx="8" class="card optional"/><text x="720" y="460" class="label" text-anchor="middle">按需管理者</text><text x="720" y="488" class="copy" text-anchor="middle">拆分多功能或多线路工作切片</text><text x="990" y="450" class="role" text-anchor="end" style="font-size:13px;fill:#667477">ap-manager</text></g>
  <path d="M720 508 L720 538 L170 538 L170 560" class="branch"/><path d="M720 538 L445 538 L445 560" class="branch"/><path d="M720 538 L720 560" class="flow"/><path d="M720 538 L995 538 L995 560" class="branch"/><path d="M720 538 L1270 538 L1270 560" class="flow"/><path d="M170 538 L170 560" class="flow"/><path d="M445 538 L445 560" class="flow"/><path d="M995 538 L995 560" class="flow"/>
  <g><rect x="45" y="560" width="250" height="170" rx="8" class="lane"/><text x="170" y="590" class="laneTitle" text-anchor="middle">范围 + 路线图</text><line x1="65" y1="608" x2="275" y2="608" class="divider"/><text x="170" y="632" class="role" text-anchor="middle">ap-scoper</text><text x="170" y="654" class="role" text-anchor="middle">ap-researcher</text><text x="170" y="676" class="role" text-anchor="middle">ap-synthesizer</text><text x="170" y="698" class="role" text-anchor="middle">ap-planner</text><text x="170" y="720" class="role" text-anchor="middle">ap-intake</text></g><g><rect x="320" y="560" width="250" height="170" rx="8" class="lane"/><text x="445" y="590" class="laneTitle" text-anchor="middle">构建</text><line x1="340" y1="608" x2="550" y2="608" class="divider"/><text x="445" y="632" class="role" text-anchor="middle">ap-implementer</text></g><g><rect x="595" y="560" width="250" height="170" rx="8" class="lane"/><text x="720" y="590" class="laneTitle" text-anchor="middle">审查</text><line x1="615" y1="608" x2="825" y2="608" class="divider"/><text x="720" y="632" class="role" text-anchor="middle">ap-reviewer</text></g><g><rect x="870" y="560" width="250" height="170" rx="8" class="lane"/><text x="995" y="590" class="laneTitle" text-anchor="middle">验证</text><line x1="890" y1="608" x2="1100" y2="608" class="divider"/><text x="995" y="632" class="role" text-anchor="middle">ap-verifier</text><text x="995" y="654" class="role" text-anchor="middle">ap-execharness-resolver</text></g><g><rect x="1145" y="560" width="250" height="170" rx="8" class="lane"/><text x="1270" y="590" class="laneTitle" text-anchor="middle">解决 + 全面检查</text><line x1="1165" y1="608" x2="1375" y2="608" class="divider"/><text x="1270" y="632" class="role" text-anchor="middle">ap-framework-generator</text><text x="1270" y="654" class="role" text-anchor="middle">ap-sweeper</text></g>
  <path d="M170 730 L170 770" class="flow"/><path d="M445 730 L445 770" class="flow"/><path d="M720 730 L720 770" class="flow"/><path d="M995 730 L995 770" class="flow"/><path d="M1270 730 L1270 770" class="flow"/>
  <g><rect x="45" y="770" width="250" height="170" rx="8" class="lane teal"/><text x="170" y="804" class="laneTitle" text-anchor="middle">全新检查</text><line x1="65" y1="820" x2="275" y2="820" class="divider"/><text x="170" y="844" class="role" text-anchor="middle">ap-fresh-verifier</text><text x="170" y="868" class="role" text-anchor="middle">ap-depth-prober</text><text x="170" y="892" class="role" text-anchor="middle">ap-preflight-probe</text></g><g><rect x="320" y="770" width="250" height="170" rx="8" class="lane teal"/><text x="445" y="804" class="laneTitle" text-anchor="middle">验证 + 签署</text><line x1="340" y1="820" x2="550" y2="820" class="divider"/><text x="445" y="844" class="role" text-anchor="middle">ap-framework-validator</text><text x="445" y="868" class="role" text-anchor="middle">ap-juror</text></g><g><rect x="595" y="770" width="250" height="170" rx="8" class="lane teal"/><text x="720" y="804" class="laneTitle" text-anchor="middle">决策</text><line x1="615" y1="820" x2="825" y2="820" class="divider"/><text x="720" y="844" class="role" text-anchor="middle">ap-goal-checker</text><text x="720" y="868" class="role" text-anchor="middle">ap-arbiter</text></g><g><rect x="870" y="770" width="250" height="170" rx="8" class="lane teal"/><text x="995" y="804" class="laneTitle" text-anchor="middle">恢复 + 记录</text><line x1="890" y1="820" x2="1100" y2="820" class="divider"/><text x="995" y="844" class="role" text-anchor="middle">ap-re-anchor</text><text x="995" y="868" class="role" text-anchor="middle">ap-scribe</text></g><g><rect x="1145" y="770" width="250" height="170" rx="8" class="lane teal"/><text x="1270" y="804" class="laneTitle" text-anchor="middle">收尾</text><line x1="1165" y1="820" x2="1375" y2="820" class="divider"/><text x="1270" y="844" class="role" text-anchor="middle">ap-janitor</text></g>
  <g aria-hidden="true">
    <line x1="60" y1="112" x2="1415" y2="112" class="layerLine"/><text x="18" y="180" class="layer">L0</text>
    <line x1="60" y1="250" x2="1415" y2="250" class="layerLine"/><text x="18" y="338" class="layer">L1</text>
    <line x1="60" y1="407" x2="1415" y2="407" class="layerLine"/><text x="18" y="472" class="layer">L2</text>
    <line x1="60" y1="526" x2="1415" y2="526" class="layerLine"/><text x="18" y="652" class="layer">L3</text>
    <line x1="60" y1="750" x2="1415" y2="750" class="layerLine"/><text x="18" y="856" class="layer">L4</text>
  </g>
</svg>
