<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1580" viewBox="0 0 1280 1580" role="img" aria-labelledby="title desc">
  <title id="title">Autoprompt 如何工作</title><desc id="desc">提示词依次经过范围定义、独立路线图检查、按需详细计划、实现、并行审查与验证，最终收敛。</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f3f3f3" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59696b"/></marker><marker id="retryArrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#965477"/></marker>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans","Microsoft YaHei","Malgun Gothic","Noto Sans Arabic",sans-serif}.card{fill:#fff;stroke:#aab5b7;stroke-width:1.5}.teal{fill:#f6edf3;stroke:#965477;stroke-width:2}.optional{fill:#fff;stroke:#839194;stroke-width:1.5;stroke-dasharray:7 5}.gate{fill:#965477;stroke:#754064;stroke-width:1.5}.decision{fill:#f5f7f7;stroke:#59696b;stroke-width:1.5}.label{fill:#172628;font-size:21px;font-weight:650}.label.small{font-size:18px}.copy{fill:#536164;font-size:18px;font-weight:450}.gateText{fill:#fff;font-size:17px;font-weight:700}.phase{fill:#5e6c6f;font-size:17px;font-weight:700;letter-spacing:.4px}.layerBracket{stroke:#9db0b2;stroke-width:2.5;stroke-linecap:square;stroke-linejoin:miter}.badge{fill:#eef2f2;stroke:#c4cdce}.badgeText{fill:#415053;font-size:15px;font-weight:700}.flow{fill:none;stroke:#59696b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.branch{fill:none;stroke:#59696b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.retry{fill:none;stroke:#965477;stroke-width:2;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#retryArrow)}.retryText{fill:#965477;font-size:17px;font-weight:650}.choice{fill:#415053;font-size:17px;font-weight:700}</style></defs>
  <rect width="1280" height="1580" fill="#ffffff"/>
  <g aria-hidden="true">
    <path d="M58 118H32V902H58" fill="none" class="layerBracket"/><text x="18" y="503" class="phase" text-anchor="middle" transform="rotate(-90 18 503)">计划</text>
    <path d="M58 902H32V1004H58" fill="none" class="layerBracket"/><text x="18" y="959" class="phase" text-anchor="middle" transform="rotate(-90 18 959)">构建</text>
    <path d="M58 1038H32V1450H58" fill="none" class="layerBracket"/><text x="18" y="1244" class="phase" text-anchor="middle" transform="rotate(-90 18 1244)">最终检查</text>
  </g>
  <g><rect x="540" y="32" width="200" height="60" rx="8" class="card teal"/><text x="640" y="69" class="label" text-anchor="middle">提示词</text></g>
  <path d="M640 92 L640 120" class="flow"/><g><rect x="440" y="120" width="400" height="80" rx="8" class="card"/><text x="640" y="153" class="label" text-anchor="middle">定义范围</text><text x="640" y="181" class="copy" text-anchor="middle">梳理请求的工作</text></g>
  <path d="M640 200 L640 236" class="flow"/><g><rect x="420" y="236" width="440" height="82" rx="8" class="card"/><text x="640" y="270" class="label" text-anchor="middle">可执行路线图</text><text x="640" y="298" class="copy" text-anchor="middle">工作项、负责人、依赖与检查</text></g>
  <path d="M640 318 L640 344 L400 344 L400 364" class="branch"/><path d="M640 344 L880 344 L880 364" class="flow"/><path d="M400 344 L400 364" class="flow"/>
  <g><rect x="220" y="364" width="360" height="86" rx="8" class="card teal"/><text x="400" y="400" class="label small" text-anchor="middle">路线图审查</text><text x="400" y="428" class="copy" text-anchor="middle">独立审查者</text></g><g><rect x="700" y="364" width="360" height="86" rx="8" class="card teal"/><text x="880" y="400" class="label small" text-anchor="middle">盲态全新验证</text><text x="880" y="428" class="copy" text-anchor="middle">检查提示词和代码库</text></g>
  <path d="M400 450 L400 474 L640 474" class="branch"/><path d="M880 450 L880 474 L640 474 L640 490" class="flow"/>
  <rect x="510" y="490" width="260" height="54" rx="27" class="gate"/><text x="640" y="524" class="gateText" text-anchor="middle">两者均批准</text>
  <path d="M640 544 L640 580" class="flow"/><rect x="440" y="580" width="400" height="66" rx="8" class="decision"/><text x="640" y="621" class="label small" text-anchor="middle">需要详细计划？</text>
  <path d="M640 646 L640 684" class="flow"/><text x="666" y="674" class="choice" text-anchor="start">是</text><g><rect x="440" y="684" width="400" height="78" rx="8" class="card optional"/><text x="640" y="716" class="label" text-anchor="middle">详细计划</text><text x="640" y="744" class="copy" text-anchor="middle">仅在需要时</text></g>
  <path d="M840 613 L1080 613 L1080 952 L840 952" class="flow"/><text x="1056" y="604" class="choice" text-anchor="end">否</text>
  <path d="M640 762 L640 786 L400 786 L400 806" class="branch"/><path d="M640 786 L880 786 L880 806" class="flow"/><path d="M400 786 L400 806" class="flow"/>
  <g><rect x="220" y="806" width="360" height="82" rx="8" class="card teal"/><text x="400" y="840" class="label small" text-anchor="middle">计划审查</text><text x="400" y="868" class="copy" text-anchor="middle">独立检查</text></g><g><rect x="700" y="806" width="360" height="82" rx="8" class="card teal"/><text x="880" y="840" class="label small" text-anchor="middle">全新计划检查</text><text x="880" y="868" class="copy" text-anchor="middle">盲态验证</text></g>
  <path d="M400 888 L400 912 L640 912" class="branch"/><path d="M880 888 L880 912 L640 912 L640 924" class="flow"/>
  <g><rect x="440" y="924" width="400" height="80" rx="8" class="card"/><text x="640" y="957" class="label" text-anchor="middle">实现</text><text x="640" y="985" class="copy" text-anchor="middle">先测试，再编码</text></g>
  <path d="M640 1004 L640 1028 L400 1028 L400 1050" class="branch"/><path d="M640 1028 L880 1028 L880 1050" class="flow"/><path d="M400 1028 L400 1050" class="flow"/>
  <g><rect x="220" y="1050" width="360" height="84" rx="8" class="card teal"/><text x="400" y="1085" class="label small" text-anchor="middle">实现审查</text><text x="400" y="1113" class="copy" text-anchor="middle">检查差异</text></g><g><rect x="700" y="1050" width="360" height="84" rx="8" class="card teal"/><text x="880" y="1085" class="label small" text-anchor="middle">测试与验证</text><text x="880" y="1113" class="copy" text-anchor="middle">运行真实检查</text></g>
  <path d="M400 1134 L400 1158 L640 1158" class="branch"/><path d="M880 1134 L880 1158 L640 1158 L640 1174" class="flow"/>
  <rect x="510" y="1174" width="260" height="54" rx="27" class="gate"/><text x="640" y="1208" class="gateText" text-anchor="middle">两者均通过</text>
  <path d="M640 1228 L640 1264" class="flow"/><g><rect x="440" y="1264" width="400" height="72" rx="8" class="card optional"/><text x="640" y="1293" class="label" text-anchor="middle">独立签署</text><text x="640" y="1321" class="copy" text-anchor="middle">需要时执行</text></g>
  <path d="M640 1336 L640 1370" class="flow"/><g><rect x="420" y="1370" width="440" height="80" rx="8" class="card teal"/><text x="640" y="1403" class="label small" text-anchor="middle">全面检查与目标核验</text><text x="640" y="1431" class="copy" text-anchor="middle">所有要求与问题均已解决</text></g>
  <path d="M640 1450 L640 1486" class="flow"/><rect x="540" y="1486" width="200" height="58" rx="29" class="gate"/><text x="640" y="1523" class="gateText" text-anchor="middle">完成</text>
    <path d="M220 407 L142 407 L142 277 L420 277" class="retry"/><rect x="48" y="367" width="170" height="30" rx="5" fill="#ffffff"/><text x="133" y="388" class="retryText" text-anchor="middle">路线图缺口</text>
    <path d="M220 847 L112 847 L112 723 L440 723" class="retry"/><rect x="48" y="807" width="170" height="30" rx="5" fill="#ffffff"/><text x="133" y="828" class="retryText" text-anchor="middle">计划缺口</text>
    <path d="M1060 1092 L1160 1092 L1160 964 L840 964" class="retry"/><rect x="1062" y="1047" width="170" height="30" rx="5" fill="#ffffff"/><text x="1147" y="1068" class="retryText" text-anchor="middle">局部问题</text>
</svg>
