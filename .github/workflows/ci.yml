name: CI

on:
  push:
    branches:
      - main
      - beta-test/codex-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.node == '24' && 90 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20"
          - "22"
          - "24"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install validation parsers
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3 jsonschema==4.26.0
      - name: Permit native sandbox namespaces on the disposable Linux runner
        if: matrix.node == '24'
        # Ubuntu's additional AppArmor userns gate otherwise rejects nested
        # native sandbox setup. Tests still run as the unprivileged runner and
        # enforce actual filesystem/network isolation; no product setting changes.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install pinned Codex before dependent tests
        run: |
          npm install --global --prefix "${{ runner.temp }}/autoprompt-codex-cli" --install-strategy=nested --ignore-scripts --no-audit --no-fund @openai/codex@0.148.0
          node tests/helpers/export-pinned-codex-ci.cjs "${{ runner.temp }}/autoprompt-codex-cli"
      - name: Run package, provider, and benchmark tests
        run: npm test
      - name: Run Codex core including required native transport probes
        if: matrix.node == '24'
        run: npm run test:codex-core
      - name: Run packed Codex lifecycle
        if: matrix.node == '24'
        run: npm run test:codex-lifecycle

  windows-provider-contracts:
    name: Windows provider contracts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install validation parsers
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3 jsonschema==4.26.0
      - name: Install pinned Codex for offline package contracts
        run: |
          npm install --global --prefix "${{ runner.temp }}/autoprompt-codex-cli" --install-strategy=nested --ignore-scripts --no-audit --no-fund @openai/codex@0.148.0
          node tests/helpers/export-pinned-codex-ci.cjs "${{ runner.temp }}/autoprompt-codex-cli"
      - name: Run package, provider, and benchmark tests
        run: npm test
      - name: Run older Codex upgrade lifecycle
        run: node --test --test-name-pattern="receiptless legacy" tests/source/install-custom-root.test.cjs

  pull-request-lifecycle:
    name: Pull request lifecycle (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install validation parsers
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3 jsonschema==4.26.0
      - name: Permit native sandbox namespaces on the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install pinned Codex before dependent tests
        run: |
          npm install --global --prefix "${{ runner.temp }}/autoprompt-codex-cli" --install-strategy=nested --ignore-scripts --no-audit --no-fund @openai/codex@0.148.0
          node tests/helpers/export-pinned-codex-ci.cjs "${{ runner.temp }}/autoprompt-codex-cli"
      - name: Check pull request lifecycle contract
        run: node --test tests/source/ci-codex-packed-pr-contract.test.cjs
      - name: Run full verification, including packed Codex lifecycle
        run: npm run verify
