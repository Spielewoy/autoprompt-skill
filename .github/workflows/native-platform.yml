      - name: Preserve native process and thread isolation evidence
        if: always() && steps.msys-proof-input.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-process-security-proof
          path: ${{ runner.temp }}/msys-process-security-proof
          if-no-files-found: warn
      - name: Verify native POSIX IPC and cancellation with the built MSYS runtime
        id: msys-posix
        if: steps.msys-smoke.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'msys-compiler-proof'
