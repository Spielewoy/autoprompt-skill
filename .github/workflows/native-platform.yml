name: Native platform validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  platform-primitives:
    name: Platform and installer / ${{ matrix.runner.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner.os }}
    # The one diagnostic producer may compile a separate traced DLL after the
    # normal fork proof fails. All other matrix jobs retain their original cap.
    timeout-minutes: ${{ matrix.runner.os == 'windows-latest' && matrix.node == '24.x' && 120 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - { os: ubuntu-latest, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-latest, arch: arm64 }
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
        node: ['20.x', '24.x']
    env:
      AUTOPROMPT_CI_EXPECTED_ARCH: ${{ matrix.runner.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.runner.arch }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.runner.arch }}
      - name: Install declared Python installer and validation dependencies
        run: 'python -m pip install --only-binary=:all: PyYAML==6.0.3 jsonschema==4.26.0 referencing==0.37.0'
      - name: Install and enable Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install macOS installer shells
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install bash
          if ! command -v pwsh >/dev/null 2>&1; then
            brew install powershell
          fi
      - name: Require PowerShell
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()
      - run: npm ci --ignore-scripts
      - name: Enable genuine macOS primitive tests and assert runtime limitation
        if: runner.os == 'macOS'
        run: node tests/helpers/native-platform-ci.cjs macos-primitives
      - name: Enable actual Windows short-name coverage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          fsutil 8dot3name set 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Windows runtime bundle physical capture
        id: runtime-physical-proof
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          node --test --test-reporter=tap scripts/windows-runtime/physical-proof/audit.test.cjs 2>&1 | Tee-Object -FilePath native-windows-runtime-physical.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-runtime/physical-proof/verify-output.cjs native-windows-runtime-physical.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native runtime bundle capture observations
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-runtime-physical-${{ matrix.runner.arch }}-node-${{ matrix.node }}
          path: native-windows-runtime-physical.log
          if-no-files-found: error
      - name: Build and verify fixed native capture executable
        id: runtime-precompiled-proof
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          node --test scripts/windows-runtime/precompiled-proof/verify-output.test.cjs scripts/windows-runtime/precompiled-proof/verify-acl-output.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $build = Join-Path $env:RUNNER_TEMP 'precompiled-capture'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -File scripts/windows-runtime/precompiled-proof/build.ps1 -OutputDirectory $build 2>&1 | Tee-Object -FilePath native-windows-runtime-precompiled-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AUTOPROMPT_CAPTURE_BUILD = $build
          node --test --test-reporter=tap scripts/windows-runtime/precompiled-proof/native.test.cjs 2>&1 | Tee-Object -FilePath (Join-Path $build 'native.tap')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-runtime/precompiled-proof/verify-output.cjs (Join-Path $build 'native.tap')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-reporter=tap scripts/windows-runtime/precompiled-proof/acl.test.cjs 2>&1 | Tee-Object -FilePath (Join-Path $build 'acl-native.tap')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-runtime/precompiled-proof/verify-acl-output.cjs (Join-Path $build 'acl-native.tap')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve fixed native capture executable and observations
        id: runtime-precompiled-evidence
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-runtime-precompiled-${{ matrix.runner.arch }}-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/precompiled-capture
            native-windows-runtime-precompiled-build.log
          if-no-files-found: error
      - name: Record native Git metadata ACL controls before the full suite
        id: git-acl-proof
        if: runner.os == 'Windows'
        # The identical denial/restoration test remains mandatory in the full suite.
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: |
          node --test --test-reporter=tap --test-name-pattern='^native Windows \.git grants deny mutation and restore inheritance after owned drain$' tests/source/windows-appcontainer-git-acl.test.cjs 2>&1 | Tee-Object -FilePath native-windows-git-acl.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native Git metadata ACL observations
        id: git-acl-evidence
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-git-acl-${{ matrix.runner.arch }}-node-${{ matrix.node }}
          path: native-windows-git-acl.log
          if-no-files-found: error
      - name: Record native host NUL query sizes before sandbox launches
        if: runner.os == 'Windows'
        # Independent of the AppContainer launcher; mandatory again in the full suite.
        continue-on-error: true
        shell: pwsh
        run: |
          node --test --test-reporter=tap --test-name-pattern="^native Windows host NUL basic query records exact and oversized buffer results$" tests/source/windows-appcontainer-nul-capability.test.cjs 2>&1 | Tee-Object -FilePath native-windows-nul-basic.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native host NUL query observations
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-nul-basic-${{ matrix.runner.arch }}-node-${{ matrix.node }}
          path: native-windows-nul-basic.log
          if-no-files-found: error
      - name: Record native Windows pipe compatibility before the full suite
        if: runner.os == 'Windows'
        # This early copy supplies prompt diagnostics. The identical test is
        # mandatory in the full suite below and still fails the job there.
        continue-on-error: true
        shell: pwsh
        run: |
          node --test tests/source/windows-msys-pipe.test.cjs 2>&1 | Tee-Object -FilePath native-windows-pipe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record native Windows Node pipes and process-exit verification
        if: runner.os == 'Windows'
        # The same diagnostic remains mandatory in the full platform suite.
        # Unsupported observations are explicit and do not certify functionality.
        continue-on-error: true
        shell: pwsh
        run: |
          node --test tests/source/windows-appcontainer-node-pipes.test.cjs tests/source/windows-appcontainer-member-image.test.cjs 2>&1 | Tee-Object -FilePath native-windows-node-pipes.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record native Windows NUL access and private handle isolation
        if: runner.os == 'Windows'
        # Actual access observations are mandatory in the full suite as well.
        continue-on-error: true
        shell: pwsh
        run: |
          node --test --test-reporter=tap tests/source/windows-appcontainer-nul.test.cjs tests/source/windows-appcontainer-nul-capability.test.cjs tests/source/windows-null-capability-contract.test.cjs 2>&1 | Tee-Object -FilePath native-windows-nul.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record isolated Windows capture input diagnostics
        if: runner.os == 'Windows'
        # This exact native case remains mandatory in the full suite below.
        continue-on-error: true
        shell: pwsh
        run: |
          node --test --test-name-pattern="Windows terminal publication" tests/source/windows-filesystem.test.cjs 2>&1 | Tee-Object -FilePath native-windows-capture.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve early native Windows observations
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-early-${{ matrix.runner.os }}-node-${{ matrix.node }}
          path: native-windows-*.log
          if-no-files-found: error
      - name: Compare isolated Windows PowerShell startup environments
        id: powershell-startup
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          node --test tests/source/windows-powershell-startup.test.cjs 2>&1 | Tee-Object -FilePath native-windows-powershell-startup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows PowerShell startup comparisons
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-startup-${{ matrix.runner.os }}-node-${{ matrix.node }}
          path: native-windows-powershell-startup.log
          if-no-files-found: error
      # Branch-scoped compiler investigation. Only the separate smoke proof
      # selects its private built closure; the full platform gates are unchanged.
      # Keep this within the existing 20-job matrix.
      - name: Detect changes to the MSYS compiler proof
        id: msys-proof-input
        if: github.ref == 'refs/heads/codex/issue-27-native-platform-support' && matrix.runner.os == 'windows-latest' && matrix.node == '24.x'
        shell: pwsh
        run: |
          $changed = @(git diff --name-only HEAD^ HEAD -- .github/workflows/native-platform.yml scripts/windows-msys agents/codex/workflow/windows-appcontainer* agents/codex/workflow/windows-filesystem.ps1 tests/source/windows-bash-runtime.test.cjs tests/fixtures/windows-msys/bash-ipc.sh)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "run=$($changed.Count -gt 0 -or '${{ github.event_name }}' -eq 'workflow_dispatch')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Compile the isolated MSYS pipe adapter proof
        id: msys-proof
        if: steps.msys-proof-input.outputs.run == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          node --test scripts/windows-msys/build-boundaries.test.cjs scripts/windows-msys/probe-built-runtime.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patch = (Resolve-Path scripts/windows-msys/pipe-security.patch).Path
          $digest = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          ./scripts/windows-msys/build.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'msys-compiler-proof') -Mode proof -AdaptationPatch $patch -AdaptationSha256 $digest -Jobs 4 -CompilePosixFixture
      - name: Export the exact compiled MSYS candidate for native reuse
        id: msys-candidate
        if: steps.msys-proof.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'msys-compiler-proof'
          $export = Join-Path $env:RUNNER_TEMP 'msys-candidate-export'
          New-Item -ItemType Directory -Path $export -ErrorAction Stop | Out-Null
          $context = Join-Path $export 'producer-context.json'
          node scripts/windows-msys/portable-runtime/producer-context.cjs $PWD.Path $work $context
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-msys/portable-runtime/cli.cjs export $PWD.Path $work $context (Join-Path $export 'packet') | Set-Content -LiteralPath (Join-Path $export 'producer-result.json') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish immutable MSYS candidate bytes and producer authority
        if: steps.msys-candidate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/msys-candidate-export
          if-no-files-found: error
      - name: Verify adapted descriptors and cross-profile denial natively
        id: msys-descriptor
        if: steps.msys-proof.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'msys-compiler-proof'
          $payload = Join-Path $work 'sdk/issue27-build'
          $prepared = Join-Path $env:RUNNER_TEMP 'msys-descriptor-prepared'
          $toolchain = Join-Path $env:RUNNER_TEMP 'msys-descriptor-toolchain'
          $output = Join-Path $env:RUNNER_TEMP 'msys-descriptor-proof'
          node --test scripts/windows-msys/descriptor-proof/parser.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows-msys/descriptor-proof/prepare.py $PWD.Path $prepared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/windows-msys/descriptor-proof/discovery.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows-msys/descriptor-proof/discover-toolchain.ps1 -WorkRoot $toolchain
          $manifest = Join-Path $payload 'stage.sha256'
          $digest = node -e "const fs=require('node:fs'); const p=require('./scripts/windows-msys/probe-built-runtime.cjs'); process.stdout.write(p.stagedDigest(fs.readFileSync(process.argv[1])));" $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-msys/descriptor-proof/run.cjs $PWD.Path $prepared (Join-Path $work 'sdk/usr/bin/bash.exe') (Join-Path $payload 'stage/usr/bin/msys-2.0.dll') $output (Join-Path $toolchain 'toolchain.json') $digest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native descriptor proof evidence
        if: always() && steps.msys-proof-input.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-descriptor-proof
          path: |
            ${{ runner.temp }}/msys-descriptor-prepared
            ${{ runner.temp }}/msys-descriptor-toolchain
            ${{ runner.temp }}/msys-descriptor-proof/artifacts
          if-no-files-found: warn
      - name: Exercise the built MSYS runtime in a private Bash closure
        id: msys-smoke
        if: steps.msys-proof.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/windows-msys/probe-built-runtime.cjs (Join-Path $env:RUNNER_TEMP 'msys-compiler-proof')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare native entropy initialization directly and through Bash
        id: msys-entropy
        if: steps.msys-proof.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'msys-compiler-proof'
          $toolchain = Join-Path $env:RUNNER_TEMP 'msys-descriptor-toolchain/toolchain.json'
          $output = Join-Path $env:RUNNER_TEMP 'msys-entropy-proof'
          node --test scripts/windows-msys/entropy-proof/parser.test.cjs scripts/windows-msys/entropy-proof/probe.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -LiteralPath $toolchain -Algorithm SHA256).Hash.ToLowerInvariant()
          node scripts/windows-msys/entropy-proof/build.cjs $PWD.Path $toolchain $digest $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-msys/entropy-proof/probe.cjs $work $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native entropy comparison evidence
        if: always() && steps.msys-proof-input.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-entropy-proof
          path: |
            ${{ runner.temp }}/msys-entropy-proof
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/entropy-proof.jsonl
          if-no-files-found: warn
      - name: Verify Bash child process and thread isolation across profiles
        id: msys-process-security
        if: steps.msys-proof.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'msys-compiler-proof'
          $toolchain = Join-Path $env:RUNNER_TEMP 'msys-descriptor-toolchain/toolchain.json'
          $output = Join-Path $env:RUNNER_TEMP 'msys-process-security-proof'
          node --test scripts/windows-msys/process-security-proof/parser.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -LiteralPath $toolchain -Algorithm SHA256).Hash.ToLowerInvariant()
          node scripts/windows-msys/process-security-proof/run.cjs $PWD.Path $work $toolchain $digest $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native process and thread isolation evidence
        if: always() && steps.msys-proof-input.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-process-security-proof
          path: ${{ runner.temp }}/msys-process-security-proof
          if-no-files-found: warn
      - name: Verify native POSIX IPC and cancellation with the built MSYS runtime
        id: msys-posix
        if: steps.msys-smoke.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'msys-compiler-proof'
          node scripts/windows-msys/probe-posix-runtime.cjs $PWD.Path $work (Join-Path $work 'sdk/issue27-build/posix-compile-fixture')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve the MSYS compiler proof and diagnostics
        if: always() && steps.msys-proof-input.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-compiler-proof
          path: |
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/build/*.txt
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/build/**/config.log
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/*.txt
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/*.sha256
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/built-runtime-manifest.json
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/stage
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/proof-runtime-*
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/posix-compile-fixture
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/posix-proof-*/results.jsonl
          if-no-files-found: warn
      - name: Trace failed MSYS fork initialization in a separate diagnostic build
        id: msys-fork-trace
        if: steps.msys-proof.outcome == 'success' && steps.msys-process-security.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'msys-compiler-proof'
          $sdk = Join-Path $work 'sdk'
          $payload = Join-Path $sdk 'issue27-build'
          $trace = Join-Path $sdk 'issue27-fork-trace'
          $normalManifest = Join-Path $env:RUNNER_TEMP 'msys-process-security-proof/native-manifest.json'
          $output = Join-Path $env:RUNNER_TEMP 'msys-fork-trace-proof'
          $pythonOutput = @(& python -I -c 'import sys; print(sys.executable)' 2>&1)
          if ($LASTEXITCODE -ne 0 -or $pythonOutput.Count -ne 1 -or $pythonOutput[0] -isnot [string]) { throw 'Cannot determine one Python executable' }
          $pythonExe = [string]$pythonOutput[0]
          if (-not [IO.Path]::IsPathFullyQualified($pythonExe) -or -not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) { throw 'Python identity is not an absolute executable' }
          $nodeOutput = @(& node -p 'process.execPath' 2>&1)
          if ($LASTEXITCODE -ne 0 -or $nodeOutput.Count -ne 1 -or $nodeOutput[0] -isnot [string]) { throw 'Cannot determine one Node executable' }
          $nodeExe = [string]$nodeOutput[0]
          if (-not [IO.Path]::IsPathFullyQualified($nodeExe) -or -not (Test-Path -LiteralPath $nodeExe -PathType Leaf)) { throw 'Node identity is not an absolute executable' }
          & $nodeExe --test scripts/windows-msys/fork-init-trace/parser.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $pythonExe -I scripts/windows-msys/fork-init-trace/generate.py (Join-Path $payload 'source') (Join-Path $PWD.Path 'scripts/windows-msys/pipe-security.patch') $trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nodeExe -e 'require("./agents/codex/workflow/safe-run-root.js").ensureWindowsPrivateAcl(process.argv[1])' $trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath scripts/windows-msys/fork-init-trace/build-trace.sh -Destination (Join-Path $trace 'build-trace.sh') -ErrorAction Stop
          $tracePatchSha = (Get-FileHash -LiteralPath (Join-Path $trace 'trace.patch') -Algorithm SHA256).Hash.ToLowerInvariant()
          $lock = Get-Content -LiteralPath scripts/windows-msys/build-lock.json -Raw | ConvertFrom-Json
          $savedPath = $env:PATH
          try {
            $env:MSYSTEM = 'MSYS'
            $env:MSYS2_PATH_TYPE = 'strict'
            $env:CHERE_INVOKING = '1'
            $env:PATH = (Join-Path $sdk 'usr/bin') + ';' + (Join-Path $env:SystemRoot 'System32')
            & (Join-Path $sdk 'usr/bin/bash.exe') --noprofile --norc /issue27-fork-trace/build-trace.sh '4' ([string]$lock.source.sourceDateEpoch) $tracePatchSha
            if ($LASTEXITCODE -ne 0) { throw 'Separate diagnostic compile failed; preserve logs' }
          } finally { $env:PATH = $savedPath }
          $traceDll = Join-Path $trace 'stage/usr/bin/msys-2.0.dll'
          $traceManifest = Join-Path $trace 'trace-manifest.json'
          $context = [ordered]@{
            schema = 1; workRoot = $work
            traceDll = $traceDll; traceDllSha256 = (Get-FileHash -LiteralPath $traceDll -Algorithm SHA256).Hash.ToLowerInvariant()
            traceManifest = $traceManifest; traceManifestSha256 = (Get-FileHash -LiteralPath $traceManifest -Algorithm SHA256).Hash.ToLowerInvariant()
            normalManifest = $normalManifest; normalManifestSha256 = (Get-FileHash -LiteralPath $normalManifest -Algorithm SHA256).Hash.ToLowerInvariant()
            python = $pythonExe; pythonSha256 = (Get-FileHash -LiteralPath $pythonExe -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $contextPath = Join-Path $trace 'context.json'
          [IO.File]::WriteAllText($contextPath, (($context | ConvertTo-Json -Depth 5) + "`n"), [Text.UTF8Encoding]::new($false))
          $contextSha = (Get-FileHash -LiteralPath $contextPath -Algorithm SHA256).Hash.ToLowerInvariant()
          & $nodeExe scripts/windows-msys/fork-init-trace/run.cjs $PWD.Path $contextPath $contextSha $output $env:SystemRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve separate fork initialization trace evidence
        if: always() && steps.msys-fork-trace.outcome != 'skipped' && steps.msys-proof-input.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-fork-initialization-trace
          path: |
            ${{ runner.temp }}/msys-fork-trace-proof
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/*.json
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/*.patch
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/*.sh
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/*.txt
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/*.sha256
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/build/*.txt
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/build/**/config.log
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/stage
          if-no-files-found: warn
      # Compile Node separately from MSYS, within the existing matrix. Source or
      # fixture changes rebuild it; workflow-only diagnostics reuse no binaries
      # and do not repeat a full compile. Manual dispatch rebuilds both workers.
      - name: Detect changes to the Node compiler proof
        id: node-proof-input
        if: github.ref == 'refs/heads/codex/issue-27-native-platform-support' && runner.os == 'Windows' && matrix.node == '20.x'
        shell: pwsh
        run: |
          $changed = @(git diff --name-only HEAD^ HEAD -- scripts/windows-node tests/fixtures/windows-appcontainer/node-pipe-proof.cs tests/fixtures/windows-appcontainer/node-pipe-worker.cjs tests/source/windows-appcontainer-node-pipes.test.cjs tests/helpers/windows-node-pipe-worker.cjs)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "run=$($changed.Count -gt 0 -or '${{ github.event_name }}' -eq 'workflow_dispatch')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Compile the isolated Node AppContainer pipe adapter
        id: node-proof
        if: steps.node-proof-input.outputs.run == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          node --test scripts/windows-node/build-boundaries.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/windows-node/verify-native-proof.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows-node/build.ps1 -Architecture '${{ matrix.runner.arch }}' -WorkRoot (Join-Path $env:RUNNER_TEMP 'node-compiler-proof')
      - name: Require exact subprocess roundtrips with the built Node worker
        id: node-smoke
        if: steps.node-proof.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'node-compiler-proof/stage'
          $proof = Get-Content -LiteralPath (Join-Path $stage 'provenance.json') -Raw | ConvertFrom-Json
          $env:AUTOPROMPT_NODE_PIPE_WORKER = Join-Path $stage 'node.exe'
          $env:AUTOPROMPT_NODE_PIPE_WORKER_SHA256 = $proof.nodeSha256
          $env:AUTOPROMPT_NODE_PIPE_REQUIRE_SUPPORT = '1'
          node --test --test-reporter=tap tests/source/windows-appcontainer-node-pipes.test.cjs 2>&1 | Tee-Object -FilePath (Join-Path $stage 'built-runtime-proof.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-node/verify-native-proof.cjs (Join-Path $stage 'built-runtime-proof.txt') (Join-Path $stage 'provenance.json') (Join-Path $stage 'node.exe') $proof.nodeSha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve the Node compiler output and native observations
        if: always() && steps.node-proof-input.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-node-compiler-proof-${{ matrix.runner.arch }}
          path: |
            ${{ runner.temp }}/node-compiler-proof/logs
            ${{ runner.temp }}/node-compiler-proof/stage
            ${{ runner.temp }}/node-compiler-proof/inputs/build-lock.json
            ${{ runner.temp }}/node-compiler-proof/inputs/libuv-appcontainer-pipes.patch
            ${{ runner.temp }}/node-compiler-proof/inputs/libuv-private-nul-capability.patch
          if-no-files-found: warn
      - name: Check exact MSYS child creation contracts
        if: runner.os == 'Linux' && matrix.node == '24.x'
        run: |
          python3 scripts/windows-msys/child-security-proof/run.py
          python3 scripts/windows-msys/anonymous-proof/run.py
          python3 scripts/windows-msys/null-proof/run.py
          python3 scripts/windows-msys/token-default-proof/run.py
          python3 scripts/windows-msys/loader-lock-proof/run.py
          python3 scripts/windows-msys/fork-init-trace/test.py
          node --test scripts/windows-msys/fork-init-trace/parser.test.cjs
          node --test scripts/windows-msys/process-security-proof/parser.test.cjs
          node --test scripts/windows-msys/portable-runtime/portable.test.cjs scripts/windows-msys/portable-runtime/cli.test.cjs scripts/windows-msys/portable-runtime/producer-context.test.cjs
          node --test scripts/windows-msys/portable-probe/*.test.cjs scripts/windows-msys/portable-consumer/native-writer.test.cjs scripts/windows-msys/diagnostic-smoke/diagnostic-smoke.test.cjs
          python3 -m unittest discover -s scripts/windows-msys/portable-consumer -p 'test_*.py' -v
      - name: Detect changes for native ARM64 candidate reuse
        id: msys-portable-input
        if: github.ref == 'refs/heads/codex/issue-27-native-platform-support' && runner.os == 'Windows' && matrix.runner.arch == 'arm64'
        shell: pwsh
        run: |
          $changed = @(git diff --name-only HEAD^ HEAD -- .github/workflows/native-platform.yml scripts/windows-msys agents/codex/workflow/windows-appcontainer* agents/codex/workflow/windows-filesystem.ps1 tests/source/windows-bash-runtime.test.cjs tests/fixtures/windows-msys/bash-ipc.sh)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "run=$($changed.Count -gt 0 -or '${{ github.event_name }}' -eq 'workflow_dispatch')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Verify current-run MSYS candidate with native ARM64 Node
        id: msys-portable
        if: steps.msys-portable-input.outputs.run == 'true' && steps.runtime-precompiled-proof.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 55
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/windows-msys/portable-consumer/controller-selection.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # BEGIN exact running Node identity
          $controllerOutput = @(& node -p 'process.execPath' 2>&1)
          $controllerStatus = $LASTEXITCODE
          if ($controllerStatus -ne 0 -or $controllerOutput.Count -ne 1 -or $controllerOutput[0] -isnot [string]) { throw 'Cannot determine one running Node executable' }
          $controller = [string]$controllerOutput[0]
          if ($controller.Length -eq 0 -or $controller.Length -gt 32767 -or $controller -match '[\r\n\x00]' -or -not [IO.Path]::IsPathRooted($controller) -or -not (Test-Path -LiteralPath $controller -PathType Leaf)) { throw 'Invalid running Node executable path' }
          $controllerHashes = @(Get-FileHash -LiteralPath $controller -Algorithm SHA256 -ErrorAction Stop)
          if ($controllerHashes.Count -ne 1 -or $controllerHashes[0].Hash -notmatch '^[A-Fa-f0-9]{64}$') { throw 'Cannot bind one running Node executable hash' }
          $digest = ([string]$controllerHashes[0].Hash).ToLowerInvariant()
          # END exact running Node identity
          $consumerLog = Join-Path $env:RUNNER_TEMP 'msys-portable-consumer-console.log'
          New-Item -ItemType File -Path $consumerLog -ErrorAction Stop | Out-Null
          python scripts/windows-msys/portable-consumer/run.py --repo $PWD.Path --output (Join-Path $env:RUNNER_TEMP 'msys-portable-consumer') --controller $controller --controller-sha256 $digest --helper-directory (Join-Path $env:RUNNER_TEMP 'precompiled-capture') --artifact-timeout 2400 2>&1 | Tee-Object -FilePath $consumerLog
          $consumerStatus = $LASTEXITCODE
          if ($consumerStatus -ne 0) { exit $consumerStatus }
      - name: Preserve fresh ARM64 candidate execution evidence
        id: msys-portable-evidence
        if: always() && steps.msys-portable-input.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-portable-arm64-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/msys-portable-consumer
            ${{ runner.temp }}/msys-portable-consumer-console.log
          if-no-files-found: error
      - name: Run platform tests and reject skips of this host's native cases
        run: node tests/helpers/native-platform-ci.cjs platform
      - name: Verify doctor readiness and isolated Bash and PowerShell diagnostics
        run: node tests/helpers/native-platform-ci.cjs doctor
      - name: Exercise the actual Windows Git Bash Kilo installer lifecycle
        if: runner.os == 'Windows'
        run: node tests/helpers/native-platform-ci.cjs kilo-shell
      - name: Preserve platform and diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-${{ matrix.runner.os }}-node-${{ matrix.node }}
          path: |
            native-platform-primitives.log
            native-platform-doctor.log
            native-platform-kilo-shell.log
          if-no-files-found: warn
      - name: Packed installer lifecycle
        run: node --test --test-concurrency=1 tests/source/packed-harness-v2-lifecycle.test.cjs
      - name: Require native startup and selected compiler proofs to succeed
        if: always() && (steps.runtime-physical-proof.outcome == 'failure' || steps.runtime-precompiled-proof.outcome == 'failure' || steps.runtime-precompiled-evidence.outcome == 'failure' || steps.git-acl-proof.outcome == 'failure' || steps.git-acl-evidence.outcome == 'failure' || steps.powershell-startup.outcome == 'failure' || steps.msys-proof.outcome == 'failure' || steps.msys-candidate.outcome == 'failure' || steps.msys-descriptor.outcome == 'failure' || steps.msys-smoke.outcome == 'failure' || steps.msys-entropy.outcome == 'failure' || steps.msys-process-security.outcome == 'failure' || steps.msys-posix.outcome == 'failure' || steps.node-proof.outcome == 'failure' || steps.node-smoke.outcome == 'failure' || steps.msys-portable.outcome == 'failure' || steps.msys-portable-evidence.outcome == 'failure')
        run: node -e "process.exit(1)"

  claude-native:
    name: Actual Claude 2.1.270 / ${{ matrix.runner.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner:
          - { os: ubuntu-latest, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
        node: ['20.x', '24.x']
    env:
      CLAUDE_CODE_VERSION: '2.1.270'
      AUTOPROMPT_CI_EXPECTED_ARCH: ${{ matrix.runner.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.runner.arch }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.runner.arch }}
      - name: Install declared Python installer and validation dependencies
        run: 'python -m pip install --only-binary=:all: PyYAML==6.0.3 jsonschema==4.26.0 referencing==0.37.0'
      - name: Install and enable Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci --ignore-scripts
      - name: Select the runner's vendor binary
        run: node tests/helpers/native-platform-ci.cjs prepare
      - name: Install exact native Claude package without lifecycle scripts
        shell: bash
        run: npm install --prefix .native-claude --ignore-scripts --no-package-lock --no-audit --no-fund "${CLAUDE_NATIVE_PACKAGE}@${CLAUDE_CODE_VERSION}"
      - name: Require native sandbox and run every Claude capability
        run: node tests/helpers/native-platform-ci.cjs run
      - name: Preserve actual platform evidence and test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-claude-${{ matrix.runner.os }}-node-${{ matrix.node }}
          path: |
            native-platform-evidence.json
            native-platform-tests.log
          if-no-files-found: warn
