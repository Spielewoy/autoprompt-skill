          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve the MSYS compiler proof and diagnostics
        if: always() && steps.msys-proof-input.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-compiler-proof
          path: |
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/build/*.txt
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/build/**/config.log
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/*.txt
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/*.sha256
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/built-runtime-manifest.json
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/stage
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/proof-runtime-*
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/posix-compile-fixture
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/posix-proof-*/results.jsonl
          if-no-files-found: warn
      - name: Trace failed MSYS fork initialization in a separate diagnostic build
        id: msys-fork-trace
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true) && (steps.msys-proof.outcome == 'success' && steps.msys-process-security.outcome == 'failure')
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'msys-compiler-proof'
          $sdk = Join-Path $work 'sdk'
          $payload = Join-Path $sdk 'issue27-build'
          $trace = Join-Path $sdk 'issue27-fork-trace'
          $normalManifest = Join-Path $env:RUNNER_TEMP 'msys-process-security-proof/native-manifest.json'
          $output = Join-Path $env:RUNNER_TEMP 'msys-fork-trace-proof'
          $pythonOutput = @(& python -I -c 'import sys; print(sys.executable)' 2>&1)
          if ($LASTEXITCODE -ne 0 -or $pythonOutput.Count -ne 1 -or $pythonOutput[0] -isnot [string]) { throw 'Cannot determine one Python executable' }
          $pythonExe = [string]$pythonOutput[0]
          if (-not [IO.Path]::IsPathFullyQualified($pythonExe) -or -not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) { throw 'Python identity is not an absolute executable' }
          $nodeOutput = @(& node -p 'process.execPath' 2>&1)
          if ($LASTEXITCODE -ne 0 -or $nodeOutput.Count -ne 1 -or $nodeOutput[0] -isnot [string]) { throw 'Cannot determine one Node executable' }
          $nodeExe = [string]$nodeOutput[0]
          if (-not [IO.Path]::IsPathFullyQualified($nodeExe) -or -not (Test-Path -LiteralPath $nodeExe -PathType Leaf)) { throw 'Node identity is not an absolute executable' }
          & $nodeExe --test scripts/windows-msys/fork-init-trace/parser.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $pythonExe -I scripts/windows-msys/fork-init-trace/generate.py (Join-Path $payload 'source') (Join-Path $PWD.Path 'scripts/windows-msys/pipe-security.patch') $trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nodeExe -e 'require("./agents/codex/workflow/safe-run-root.js").ensureWindowsPrivateAcl(process.argv[1])' $trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath scripts/windows-msys/fork-init-trace/build-trace.sh -Destination (Join-Path $trace 'build-trace.sh') -ErrorAction Stop
          $tracePatchSha = (Get-FileHash -LiteralPath (Join-Path $trace 'trace.patch') -Algorithm SHA256).Hash.ToLowerInvariant()
          $lock = Get-Content -LiteralPath scripts/windows-msys/build-lock.json -Raw | ConvertFrom-Json
          $savedPath = $env:PATH
          try {
            $env:MSYSTEM = 'MSYS'
            $env:MSYS2_PATH_TYPE = 'strict'
            $env:CHERE_INVOKING = '1'
            $env:PATH = (Join-Path $sdk 'usr/bin') + ';' + (Join-Path $env:SystemRoot 'System32')
            & (Join-Path $sdk 'usr/bin/bash.exe') --noprofile --norc /issue27-fork-trace/build-trace.sh '4' ([string]$lock.source.sourceDateEpoch) $tracePatchSha
            if ($LASTEXITCODE -ne 0) { throw 'Separate diagnostic compile failed; preserve logs' }
          } finally { $env:PATH = $savedPath }
          $traceDll = Join-Path $trace 'stage/usr/bin/msys-2.0.dll'
          $traceManifest = Join-Path $trace 'trace-manifest.json'
          $context = [ordered]@{
            schema = 1; workRoot = $work
            traceDll = $traceDll; traceDllSha256 = (Get-FileHash -LiteralPath $traceDll -Algorithm SHA256).Hash.ToLowerInvariant()
            traceManifest = $traceManifest; traceManifestSha256 = (Get-FileHash -LiteralPath $traceManifest -Algorithm SHA256).Hash.ToLowerInvariant()
            normalManifest = $normalManifest; normalManifestSha256 = (Get-FileHash -LiteralPath $normalManifest -Algorithm SHA256).Hash.ToLowerInvariant()
            python = $pythonExe; pythonSha256 = (Get-FileHash -LiteralPath $pythonExe -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $contextPath = Join-Path $trace 'context.json'
          [IO.File]::WriteAllText($contextPath, (($context | ConvertTo-Json -Depth 5) + "`n"), [Text.UTF8Encoding]::new($false))
          $contextSha = (Get-FileHash -LiteralPath $contextPath -Algorithm SHA256).Hash.ToLowerInvariant()
          & $nodeExe scripts/windows-msys/fork-init-trace/run.cjs $PWD.Path $contextPath $contextSha $output $env:SystemRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve separate fork initialization trace evidence
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true) && (always() && steps.msys-fork-trace.outcome != 'skipped' && steps.msys-proof-input.outputs.run == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-fork-initialization-trace
          path: |
            ${{ runner.temp }}/msys-fork-trace-proof
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/*.json
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/*.patch
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/*.sh
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/*.txt
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/*.sha256
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/build/*.txt
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/build/**/config.log
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-fork-trace/stage
          if-no-files-found: warn
      # Compile Node separately from MSYS, within the existing matrix. Source or
      # fixture changes rebuild it; workflow-only diagnostics reuse no binaries
      # and do not repeat a full compile. Manual dispatch rebuilds both workers.
      - name: Detect changes to the Node compiler proof
        id: node-proof-input
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true) && (github.ref == 'refs/heads/codex/issue-27-native-platform-support' && runner.os == 'Windows' && matrix.node == '20.x')
        shell: pwsh
        run: |
          $changed = @(git diff --name-only HEAD^ HEAD -- scripts/windows-node tests/fixtures/windows-appcontainer/node-pipe-proof.cs tests/fixtures/windows-appcontainer/node-pipe-worker.cjs tests/source/windows-appcontainer-node-pipes.test.cjs tests/helpers/windows-node-pipe-worker.cjs)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "run=$($changed.Count -gt 0 -or '${{ github.event_name }}' -eq 'workflow_dispatch')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Compile the isolated Node AppContainer pipe adapter
        id: node-proof
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true) && (steps.node-proof-input.outputs.run == 'true')
        continue-on-error: true
        shell: pwsh
        run: |
          node --test scripts/windows-node/build-boundaries.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/windows-node/verify-native-proof.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows-node/build.ps1 -Architecture '${{ matrix.runner.arch }}' -WorkRoot (Join-Path $env:RUNNER_TEMP 'node-compiler-proof')
      - name: Require exact subprocess roundtrips with the built Node worker
        id: node-smoke
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true) && (steps.node-proof.outcome == 'success')
        continue-on-error: true
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'node-compiler-proof/stage'
          $proof = Get-Content -LiteralPath (Join-Path $stage 'provenance.json') -Raw | ConvertFrom-Json
          $env:AUTOPROMPT_NODE_PIPE_WORKER = Join-Path $stage 'node.exe'
          $env:AUTOPROMPT_NODE_PIPE_WORKER_SHA256 = $proof.nodeSha256
          $env:AUTOPROMPT_NODE_PIPE_REQUIRE_SUPPORT = '1'
          node --test --test-reporter=tap tests/source/windows-appcontainer-node-pipes.test.cjs 2>&1 | Tee-Object -FilePath (Join-Path $stage 'built-runtime-proof.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-node/verify-native-proof.cjs (Join-Path $stage 'built-runtime-proof.txt') (Join-Path $stage 'provenance.json') (Join-Path $stage 'node.exe') $proof.nodeSha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve the Node compiler output and native observations
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true) && (always() && steps.node-proof-input.outputs.run == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-node-compiler-proof-${{ matrix.runner.arch }}
          path: |
            ${{ runner.temp }}/node-compiler-proof/logs
            ${{ runner.temp }}/node-compiler-proof/stage
            ${{ runner.temp }}/node-compiler-proof/inputs/build-lock.json
            ${{ runner.temp }}/node-compiler-proof/inputs/libuv-appcontainer-pipes.patch
            ${{ runner.temp }}/node-compiler-proof/inputs/libuv-private-nul-capability.patch
          if-no-files-found: warn
      - name: Check exact MSYS child creation contracts
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true) && (runner.os == 'Linux' && matrix.node == '24.x')
        run: |
          python3 scripts/windows-msys/child-security-proof/run.py
          python3 scripts/windows-msys/anonymous-proof/run.py
          python3 scripts/windows-msys/null-proof/run.py
          python3 scripts/windows-msys/token-default-proof/run.py
          python3 scripts/windows-msys/loader-lock-proof/run.py
          python3 scripts/windows-msys/fork-init-trace/test.py
          python3 scripts/windows-msys/wincap-local-proof/test.py
          python3 scripts/windows-msys/wincap-local-proof/audit-pe.test.py
          node --test scripts/windows-msys/fork-init-trace/parser.test.cjs
          node --test scripts/windows-msys/process-security-proof/parser.test.cjs
          node --test scripts/windows-msys/portable-runtime/portable.test.cjs scripts/windows-msys/portable-runtime/cli.test.cjs scripts/windows-msys/portable-runtime/producer-context.test.cjs
          node --test scripts/windows-msys/portable-probe/*.test.cjs scripts/windows-msys/portable-consumer/native-writer.test.cjs scripts/windows-msys/diagnostic-smoke/diagnostic-smoke.test.cjs
          python3 -m unittest discover -s scripts/windows-msys/portable-consumer -p 'test_*.py' -v
      - name: Detect changes for native candidate reuse
        id: msys-portable-input
        if: github.ref == 'refs/heads/codex/issue-27-native-platform-support' && runner.os == 'Windows' && (matrix.runner.arch == 'arm64' || inputs.msys_reuse_ci49 == true)
        shell: pwsh
        run: |
          $changed = @(git diff --name-only HEAD^ HEAD -- .github/workflows/native-platform.yml scripts/windows-msys agents/codex/workflow/windows-appcontainer* agents/codex/workflow/windows-filesystem.ps1 tests/source/windows-bash-runtime.test.cjs tests/fixtures/windows-msys/bash-ipc.sh)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "run=$($changed.Count -gt 0 -or '${{ github.event_name }}' -eq 'workflow_dispatch')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Verify exact MSYS candidate with native Node
        id: msys-portable
        if: steps.msys-portable-input.outputs.run == 'true' && steps.runtime-precompiled-proof.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 55
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/windows-msys/portable-consumer/controller-selection.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # BEGIN exact running Node identity
          $controllerOutput = @(& node -p 'process.execPath' 2>&1)
          $controllerStatus = $LASTEXITCODE
          if ($controllerStatus -ne 0 -or $controllerOutput.Count -ne 1 -or $controllerOutput[0] -isnot [string]) { throw 'Cannot determine one running Node executable' }
          $controller = [string]$controllerOutput[0]
          if ($controller.Length -eq 0 -or $controller.Length -gt 32767 -or $controller -match '[\r\n\x00]' -or -not [IO.Path]::IsPathRooted($controller) -or -not (Test-Path -LiteralPath $controller -PathType Leaf)) { throw 'Invalid running Node executable path' }
          $controllerHashes = @(Get-FileHash -LiteralPath $controller -Algorithm SHA256 -ErrorAction Stop)
          if ($controllerHashes.Count -ne 1 -or $controllerHashes[0].Hash -notmatch '^[A-Fa-f0-9]{64}$') { throw 'Cannot bind one running Node executable hash' }
          $digest = ([string]$controllerHashes[0].Hash).ToLowerInvariant()
          # END exact running Node identity
          $consumerLog = Join-Path $env:RUNNER_TEMP 'msys-portable-consumer-console.log'
          New-Item -ItemType File -Path $consumerLog -ErrorAction Stop | Out-Null
          $reuse = @()
          if ('${{ inputs.msys_reuse_ci49 }}' -eq 'true') { $reuse = @('--reuse-ci49') }
          python scripts/windows-msys/portable-consumer/run.py --repo $PWD.Path --output (Join-Path $env:RUNNER_TEMP 'msys-portable-consumer') --controller $controller --controller-sha256 $digest --helper-directory (Join-Path $env:RUNNER_TEMP 'precompiled-capture') --artifact-timeout 2400 @reuse 2>&1 | Tee-Object -FilePath $consumerLog
          $consumerStatus = $LASTEXITCODE
          if ($consumerStatus -ne 0) { exit $consumerStatus }
      - name: Preserve fresh native candidate execution evidence
        id: msys-portable-evidence
        if: always() && steps.msys-portable-input.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-portable-${{ matrix.runner.arch }}-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/msys-portable-consumer
            ${{ runner.temp }}/msys-portable-consumer-console.log
          if-no-files-found: error
      - name: Run platform tests and reject skips of this host's native cases
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true)
        run: node tests/helpers/native-platform-ci.cjs platform
      - name: Verify doctor readiness and isolated Bash and PowerShell diagnostics
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true)
        run: node tests/helpers/native-platform-ci.cjs doctor
      - name: Exercise the actual Windows Git Bash Kilo installer lifecycle
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true) && (runner.os == 'Windows')
        run: node tests/helpers/native-platform-ci.cjs kilo-shell
      - name: Preserve platform and diagnostic output
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true) && (always())
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-${{ matrix.runner.os }}-node-${{ matrix.node }}
          path: |
            native-platform-primitives.log
            native-platform-doctor.log
            native-platform-kilo-shell.log
            native-platform-snapshot.log
          if-no-files-found: warn
      - name: Packed installer lifecycle
        if: (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true)
        run: node --test --test-concurrency=1 tests/source/packed-harness-v2-lifecycle.test.cjs
      - name: Require native startup and selected compiler proofs to succeed
        if: always() && (steps.runtime-physical-proof.outcome == 'failure' || steps.runtime-precompiled-proof.outcome == 'failure' || steps.runtime-precompiled-evidence.outcome == 'failure' || steps.git-acl-proof.outcome == 'failure' || steps.git-acl-evidence.outcome == 'failure' || steps.resource-scale-proof.outcome == 'failure' || steps.resource-scale-evidence.outcome == 'failure' || steps.resource-identity-proof.outcome == 'failure' || steps.resource-identity-evidence.outcome == 'failure' || steps.filesystem-scale-proof.outcome == 'failure' || steps.filesystem-scale-evidence.outcome == 'failure' || steps.powershell-startup.outcome == 'failure' || steps.msys-job-startup.outcome == 'failure' || steps.msys-proof.outcome == 'failure' || steps.msys-wincap.outcome == 'failure' || steps.msys-candidate.outcome == 'failure' || steps.msys-descriptor.outcome == 'failure' || steps.msys-smoke.outcome == 'failure' || steps.msys-entropy.outcome == 'failure' || steps.msys-process-security.outcome == 'failure' || steps.msys-posix.outcome == 'failure' || steps.node-proof.outcome == 'failure' || steps.node-smoke.outcome == 'failure' || steps.msys-portable.outcome == 'failure' || steps.msys-portable-evidence.outcome == 'failure')
        run: node -e "process.exit(1)"

  claude-native:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.msys_mapping != true && inputs.msys_pipe_trace != true && inputs.msys_fork_memory != true && (inputs.msys_runtime != true && inputs.msys_reuse_ci49 != true)) }}
    name: ${{ inputs.windows_regressions == true && 'Windows regressions' || 'Actual Claude 2.1.270' }} / ${{ matrix.runner.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner.os }}
    # Windows repeats the fresh process-local command canary in the direct,
    # packed and public activation suites, including native helper startup.
    timeout-minutes: ${{ startsWith(matrix.runner.os, 'windows-') && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON((inputs.claude_diagnostic == true && inputs.claude_diagnostic_single == true && inputs.windows_regressions != true) && '{"runner":[{"os":"windows-latest","arch":"x64"}],"node":["24.x"]}' || (inputs.windows_regressions == true || inputs.claude_diagnostic == true) && '{"runner":[{"os":"windows-latest","arch":"x64"},{"os":"windows-11-arm","arch":"arm64"}],"node":["20.x","24.x"]}' || '{"runner":[{"os":"ubuntu-latest","arch":"x64"},{"os":"ubuntu-24.04-arm","arch":"arm64"},{"os":"windows-latest","arch":"x64"},{"os":"windows-11-arm","arch":"arm64"}],"node":["20.x","24.x"]}') }}
    env:
      CLAUDE_CODE_VERSION: '2.1.270'
      AUTOPROMPT_CI_EXPECTED_ARCH: ${{ matrix.runner.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.runner.arch }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.runner.arch }}
      - name: Install declared Python installer and validation dependencies
        run: 'python -m pip install --only-binary=:all: PyYAML==6.0.3 jsonschema==4.26.0 referencing==0.37.0'
      - name: Install and enable Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci --ignore-scripts
      - name: Select the runner's vendor binary
        if: inputs.windows_regressions != true
        run: node tests/helpers/native-platform-ci.cjs prepare
      - name: Install exact native Claude package without lifecycle scripts
        if: inputs.windows_regressions != true
        shell: bash
        run: npm install --prefix .native-claude --ignore-scripts --no-package-lock --no-audit --no-fund "${CLAUDE_NATIVE_PACKAGE}@${CLAUDE_CODE_VERSION}"
      - name: Require native sandbox and run every Claude capability
        if: inputs.windows_regressions != true && inputs.claude_diagnostic != true
        run: node tests/helpers/native-platform-ci.cjs run
      - name: Diagnose installed native Claude activation
        if: inputs.windows_regressions != true && inputs.claude_diagnostic == true
        env:
          AUTOPROMPT_CLAUDE_DIAGNOSTIC_STAGE: ${{ inputs.claude_diagnostic_stage || 'public' }}
        run: node tests/helpers/native-platform-ci.cjs diagnose-claude-selected
      - name: Diagnose Windows cwd, owned proxy and packed installer
        if: inputs.windows_regressions == true
        env:
          AUTOPROMPT_WINDOWS_REGRESSION_STAGE: ${{ inputs.windows_regression_stage || 'all' }}
        run: node tests/helpers/native-platform-ci.cjs windows-regressions
      - name: Preserve actual platform evidence and test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-claude-${{ matrix.runner.os }}-node-${{ matrix.node }}
          path: |
            native-platform-evidence.json
            native-platform-tests.log
            native-platform-tests-*.log
          if-no-files-found: warn

  msys-mapping:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.msys_mapping == true || inputs.msys_fork_memory == true) && inputs.msys_pipe_trace != true && github.ref == 'refs/heads/codex/issue-27-native-platform-support' }}
    name: ${{ inputs.msys_fork_memory == true && 'MSYS fork memory diagnostic' || 'MSYS mapping diagnostic' }} / ${{ matrix.runner.os }} / Node 24.x
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.msys_fork_memory == true && '{"runner":[{"os":"windows-latest","arch":"x64"}]}' || '{"runner":[{"os":"windows-latest","arch":"x64"},{"os":"windows-11-arm","arch":"arm64"}]}') }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          architecture: ${{ matrix.runner.arch }}
      - name: Download and authenticate the pinned CI38 candidate
        if: inputs.msys_fork_memory != true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $repository = 'Spielewoy/autoprompt-skill'
          $repositoryId = 1337733621
          $artifactId = 10592654730
          $runId = 35470164986
          $runAttempt = 1
          $headSha = 'eff3c98c64e2c1c93aaad13887890d3c4a841844'
          $artifactName = 'windows-msys-candidate-eff3c98c64e2c1c93aaad13887890d3c4a841844-1'
          $archiveSha256 = 'c83582caf180266a0e104da07f08ba9ac623381f44925cb2579759dc3b3f7c57'
          $manifestSha256 = '2fde936d1adc418b039c5d7e65d5d6dacc4469b433a69859ccd6cb12ccde84f4'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "https://api.github.com/repos/$repository"
          $run = Invoke-RestMethod -Headers $headers -Uri "$api/actions/runs/$runId" -Method Get
          if ($run.id -ne $runId -or $run.head_sha -ne $headSha -or $run.run_attempt -ne $runAttempt -or $run.repository.full_name -ne $repository -or $run.head_repository.full_name -ne $repository) { throw 'Pinned CI38 run identity mismatch' }
          $artifact = Invoke-RestMethod -Headers $headers -Uri "$api/actions/artifacts/$artifactId" -Method Get
          if ($artifact.id -ne $artifactId -or $artifact.name -ne $artifactName -or $artifact.expired -or $artifact.size_in_bytes -ne 2999938 -or $artifact.digest -ne "sha256:$archiveSha256") { throw 'Pinned CI38 artifact metadata mismatch' }
          if ($artifact.workflow_run.id -ne $runId -or $artifact.workflow_run.repository_id -ne $repositoryId -or $artifact.workflow_run.head_repository_id -ne $repositoryId -or $artifact.workflow_run.head_sha -ne $headSha) { throw 'Pinned CI38 artifact producer mismatch' }
          $root = Join-Path $env:RUNNER_TEMP ('msys-mapping-' + '${{ matrix.runner.arch }}')
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $output = Join-Path $env:RUNNER_TEMP 'msys-mapping-proof'
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          $archive = Join-Path $root 'candidate.zip'
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri "$api/actions/artifacts/$artifactId/zip" -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $archiveSha256) { throw "Pinned CI38 ZIP digest mismatch: $actualSha256" }
          $extracted = Join-Path $root 'extracted'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted -ErrorAction Stop
          $packet = Join-Path $extracted 'packet'
          $manifest = Join-Path $packet 'manifest.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'Authenticated candidate packet manifest missing' }
          $actualManifestSha256 = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualManifestSha256 -ne $manifestSha256) { throw "Pinned CI38 manifest digest mismatch: $actualManifestSha256" }
          [ordered]@{
            repository = $repository
            repositoryId = $repositoryId
            runId = $run.id
            runAttempt = $run.run_attempt
            headSha = $run.head_sha
            artifactId = $artifact.id
            artifactName = $artifact.name
            artifactSize = $artifact.size_in_bytes
            artifactDigest = $artifact.digest
            archiveSha256 = $actualSha256
            manifestSha256 = $actualManifestSha256
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $output 'ci38-authentication.json') -Encoding utf8
          $toolchainRoot = Join-Path $output 'pipe-toolchain'
          ./scripts/windows-msys/descriptor-proof/discover-toolchain.ps1 -WorkRoot $toolchainRoot
          $toolchain = Join-Path $toolchainRoot 'toolchain.json'
          $toolchainHash = (Get-FileHash -LiteralPath $toolchain -Algorithm SHA256).Hash.ToLowerInvariant()
          $probe = Join-Path $output 'pipe-probe-build'
          node scripts/windows-msys/mapping-proof/build-pipe.cjs $PWD.Path $toolchain $toolchainHash $probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-msys/mapping-proof/run.cjs $PWD.Path $packet $output $probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native MSYS mapping diagnostic
        if: always() && inputs.msys_fork_memory != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-mapping-${{ matrix.runner.arch }}-node-24.x
          path: ${{ runner.temp }}/msys-mapping-proof
          if-no-files-found: error

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: inputs.msys_fork_memory == true
        with:
          python-version: '3.12'
      - name: Observe the bundled runtime's fork memory reservations
        if: inputs.msys_fork_memory == true
        shell: pwsh
        run: |
          node scripts/windows-msys/fork-memory-diagnostic/compare.cjs $PWD.Path (Join-Path $env:RUNNER_TEMP 'msys-fork-memory')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native fork memory observations
        if: always() && inputs.msys_fork_memory == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-fork-memory-${{ matrix.runner.arch }}-node-24.x
          path: |
            ${{ runner.temp }}/msys-fork-memory/*.json
            ${{ runner.temp }}/msys-fork-memory/*.txt
            ${{ runner.temp }}/msys-fork-memory/generated/*
            ${{ runner.temp }}/msys-fork-memory/work/*.json
            ${{ runner.temp }}/msys-fork-memory/*/*.json
            ${{ runner.temp }}/msys-fork-memory/*/*.txt
            ${{ runner.temp }}/msys-fork-memory/*/generated/*
            ${{ runner.temp }}/msys-fork-memory/*/work/*.json
          if-no-files-found: error

  msys-pipe-trace:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.msys_pipe_trace == true && inputs.msys_fork_memory != true && github.ref == 'refs/heads/codex/issue-27-native-platform-support' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          architecture: x64
