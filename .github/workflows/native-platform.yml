          $runId = 35470164986
          $runAttempt = 1
          $headSha = 'eff3c98c64e2c1c93aaad13887890d3c4a841844'
          $artifactName = 'windows-msys-candidate-eff3c98c64e2c1c93aaad13887890d3c4a841844-1'
          $archiveSha256 = 'c83582caf180266a0e104da07f08ba9ac623381f44925cb2579759dc3b3f7c57'
          $manifestSha256 = '2fde936d1adc418b039c5d7e65d5d6dacc4469b433a69859ccd6cb12ccde84f4'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "https://api.github.com/repos/$repository"
          $run = Invoke-RestMethod -Headers $headers -Uri "$api/actions/runs/$runId" -Method Get
          if ($run.id -ne $runId -or $run.head_sha -ne $headSha -or $run.run_attempt -ne $runAttempt -or $run.repository.full_name -ne $repository -or $run.head_repository.full_name -ne $repository) { throw 'Pinned CI38 run identity mismatch' }
          $artifact = Invoke-RestMethod -Headers $headers -Uri "$api/actions/artifacts/$artifactId" -Method Get
          if ($artifact.id -ne $artifactId -or $artifact.name -ne $artifactName -or $artifact.expired -or $artifact.size_in_bytes -ne 2999938 -or $artifact.digest -ne "sha256:$archiveSha256") { throw 'Pinned CI38 artifact metadata mismatch' }
          if ($artifact.workflow_run.id -ne $runId -or $artifact.workflow_run.repository_id -ne $repositoryId -or $artifact.workflow_run.head_repository_id -ne $repositoryId -or $artifact.workflow_run.head_sha -ne $headSha) { throw 'Pinned CI38 artifact producer mismatch' }
          $root = Join-Path $env:RUNNER_TEMP ('msys-pipe-trace-candidate')
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $output = Join-Path $env:RUNNER_TEMP 'msys-mapping-proof'
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          $archive = Join-Path $root 'candidate.zip'
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri "$api/actions/artifacts/$artifactId/zip" -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $archiveSha256) { throw "Pinned CI38 ZIP digest mismatch: $actualSha256" }
          $extracted = Join-Path $root 'extracted'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted -ErrorAction Stop
          $packet = Join-Path $extracted 'packet'
          $manifest = Join-Path $packet 'manifest.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'Authenticated candidate packet manifest missing' }
          $actualManifestSha256 = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualManifestSha256 -ne $manifestSha256) { throw "Pinned CI38 manifest digest mismatch: $actualManifestSha256" }
          [ordered]@{
            repository = $repository
            repositoryId = $repositoryId
            runId = $run.id
            runAttempt = $run.run_attempt
            headSha = $run.head_sha
            artifactId = $artifact.id
            artifactName = $artifact.name
            artifactSize = $artifact.size_in_bytes
            artifactDigest = $artifact.digest
            archiveSha256 = $actualSha256
            manifestSha256 = $actualManifestSha256
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $output 'ci38-authentication.json') -Encoding utf8
          "$packet" | Set-Content -LiteralPath (Join-Path $output 'packet-path.txt') -Encoding utf8
      - name: Restore the authenticated CI46 diagnostic build
        if: inputs.msys_pipe_reuse == true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/windows-msys/pipe-io-trace/reuse-ci46.ps1 -Output (Join-Path $env:RUNNER_TEMP 'msys-mapping-proof')
      - name: Build one isolated diagnostic MSYS runtime
        if: inputs.msys_pipe_reuse != true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'msys-mapping-proof'
          $sourceRoot = Join-Path $output 'trace-source'
          New-Item -ItemType Directory -Path $sourceRoot -ErrorAction Stop | Out-Null
          $lock = Get-Content -LiteralPath scripts/windows-msys/build-lock.json -Raw | ConvertFrom-Json
          $archive = Join-Path $sourceRoot 'source.tar.gz'
          Invoke-WebRequest -UseBasicParsing -Uri $lock.source.url -OutFile $archive -TimeoutSec 300
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.source.sha256) { throw 'Source archive mismatch' }
          $source = Join-Path $sourceRoot 'pristine'
          New-Item -ItemType Directory -Path $source -ErrorAction Stop | Out-Null
          tar -xzf $archive --strip-components=1 -C $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prepared = Join-Path $output 'pipe-trace-inputs'
          python -I scripts/windows-msys/pipe-io-trace/generate.py $source scripts/windows-msys/pipe-security.patch $prepared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patch = Join-Path $prepared 'combined.patch'
          $digest = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          $savedPath = $env:PATH
          try {
            ./scripts/windows-msys/build.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'msys-pipe-trace-build') -Mode proof -AdaptationPatch $patch -AdaptationSha256 $digest -Jobs 4
          } finally { $env:PATH = $savedPath }
      - name: Observe parent reads and child writes in the sandbox
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'msys-mapping-proof'
          $packet = (Get-Content -LiteralPath (Join-Path $output 'packet-path.txt') -Raw).Trim()
          $payload = Join-Path $env:RUNNER_TEMP 'msys-pipe-trace-build/sdk/issue27-build'
          if ('${{ inputs.msys_pipe_reuse }}' -eq 'true') {
            $payload = (Get-Content -LiteralPath (Join-Path $output 'reused-payload-path.txt') -Raw).Trim()
            node scripts/windows-msys/pipe-io-trace/run.cjs $PWD.Path $packet $output $payload ci46-reuse
          } else {
            node scripts/windows-msys/pipe-io-trace/run.cjs $PWD.Path $packet $output $payload
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve diagnostic observations and compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-pipe-io-trace
          path: |
            ${{ runner.temp }}/msys-mapping-proof/ci38-authentication.json
            ${{ runner.temp }}/msys-mapping-proof/ci46-reuse.json
            ${{ runner.temp }}/msys-mapping-proof/pipe-trace-inputs
            ${{ runner.temp }}/msys-mapping-proof/pipe-io-diagnostic-*
            ${{ runner.temp }}/msys-pipe-trace-build/sdk/issue27-build/*.txt
            ${{ runner.temp }}/msys-pipe-trace-build/sdk/issue27-build/*.sha256
            ${{ runner.temp }}/msys-pipe-trace-build/sdk/issue27-build/adaptation.patch
            ${{ runner.temp }}/msys-pipe-trace-build/sdk/issue27-build/lock.json
            ${{ runner.temp }}/msys-pipe-trace-build/sdk/issue27-build/build/*.txt
            ${{ runner.temp }}/msys-pipe-trace-build/sdk/issue27-build/build/**/config.log
            ${{ runner.temp }}/msys-pipe-trace-build/sdk/issue27-build/stage/usr/bin/msys-2.0.dll
          if-no-files-found: error
