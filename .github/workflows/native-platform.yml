name: Native platform validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-primitives:
    name: Platform and installer / ${{ matrix.runner.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner:
          - { os: ubuntu-latest, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-latest, arch: arm64 }
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
        node: ['20.x', '24.x']
    env:
      AUTOPROMPT_CI_EXPECTED_ARCH: ${{ matrix.runner.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.runner.arch }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.runner.arch }}
      - name: Install declared Python installer and validation dependencies
        run: 'python -m pip install --only-binary=:all: PyYAML==6.0.3 jsonschema==4.26.0 referencing==0.37.0'
      - name: Install and enable Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install macOS installer shells
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install bash
          if ! command -v pwsh >/dev/null 2>&1; then
            brew install powershell
          fi
      - name: Require PowerShell
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()
      - run: npm ci --ignore-scripts
      - name: Enable genuine macOS primitive tests and assert runtime limitation
        if: runner.os == 'macOS'
        run: node tests/helpers/native-platform-ci.cjs macos-primitives
      - name: Enable actual Windows short-name coverage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          fsutil 8dot3name set 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record native Windows pipe compatibility before the full suite
        if: runner.os == 'Windows'
        # This early copy supplies prompt diagnostics. The identical test is
        # mandatory in the full suite below and still fails the job there.
        continue-on-error: true
        shell: pwsh
        run: |
          node --test tests/source/windows-msys-pipe.test.cjs 2>&1 | Tee-Object -FilePath native-windows-pipe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record isolated Windows capture input diagnostics
        if: runner.os == 'Windows'
        # This exact native case remains mandatory in the full suite below.
        continue-on-error: true
        shell: pwsh
        run: |
          node --test --test-name-pattern="Windows terminal publication" tests/source/windows-filesystem.test.cjs 2>&1 | Tee-Object -FilePath native-windows-capture.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve early native Windows observations
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-early-${{ matrix.runner.os }}-node-${{ matrix.node }}
          path: native-windows-*.log
          if-no-files-found: error
      - name: Compare isolated Windows PowerShell startup environments
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          node --test tests/source/windows-powershell-startup.test.cjs 2>&1 | Tee-Object -FilePath native-windows-powershell-startup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows PowerShell startup comparisons
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-startup-${{ matrix.runner.os }}-node-${{ matrix.node }}
          path: native-windows-powershell-startup.log
          if-no-files-found: error
      # Branch-scoped compiler investigation. Only the separate smoke proof
      # selects its private built closure; the full platform gates are unchanged.
      # Keep this within the existing 20-job matrix.
      - name: Detect changes to the MSYS compiler proof
        id: msys-proof-input
        if: github.ref == 'refs/heads/codex/issue-27-native-platform-support' && matrix.runner.os == 'windows-latest' && matrix.node == '24.x'
        shell: pwsh
        run: |
          $changed = @(git diff --name-only HEAD^ HEAD -- scripts/windows-msys)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "run=$($changed.Count -gt 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Compile the isolated MSYS pipe adapter proof
        id: msys-proof
        if: steps.msys-proof-input.outputs.run == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          node --test scripts/windows-msys/build-boundaries.test.cjs scripts/windows-msys/probe-built-runtime.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patch = (Resolve-Path scripts/windows-msys/pipe-security.patch).Path
          $digest = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          ./scripts/windows-msys/build.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'msys-compiler-proof') -Mode proof -AdaptationPatch $patch -AdaptationSha256 $digest -Jobs 4
      - name: Exercise the built MSYS runtime in a private Bash closure
        id: msys-smoke
        if: steps.msys-proof.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/windows-msys/probe-built-runtime.cjs (Join-Path $env:RUNNER_TEMP 'msys-compiler-proof')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve the MSYS compiler proof and diagnostics
        if: always() && steps.msys-proof-input.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msys-compiler-proof
          path: |
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/build/*.txt
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/build/**/config.log
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/*.txt
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/*.sha256
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/built-runtime-manifest.json
            ${{ runner.temp }}/msys-compiler-proof/sdk/issue27-build/stage
          if-no-files-found: warn
      - name: Run platform tests and reject skips of this host's native cases
        run: node tests/helpers/native-platform-ci.cjs platform
      - name: Verify doctor readiness and isolated Bash and PowerShell diagnostics
        run: node tests/helpers/native-platform-ci.cjs doctor
      - name: Exercise the actual Windows Git Bash Kilo installer lifecycle
        if: runner.os == 'Windows'
        run: node tests/helpers/native-platform-ci.cjs kilo-shell
      - name: Preserve platform and diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-${{ matrix.runner.os }}-node-${{ matrix.node }}
          path: |
            native-platform-primitives.log
            native-platform-doctor.log
            native-platform-kilo-shell.log
          if-no-files-found: warn
      - name: Packed installer lifecycle
        run: node --test --test-concurrency=1 tests/source/packed-harness-v2-lifecycle.test.cjs
      - name: Require the selected MSYS compiler proof to succeed
        if: always() && (steps.msys-proof.outcome == 'failure' || steps.msys-smoke.outcome == 'failure')
        run: node -e "process.exit(1)"

  claude-native:
    name: Actual Claude 2.1.270 / ${{ matrix.runner.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner:
          - { os: ubuntu-latest, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
        node: ['20.x', '24.x']
    env:
      CLAUDE_CODE_VERSION: '2.1.270'
      AUTOPROMPT_CI_EXPECTED_ARCH: ${{ matrix.runner.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.runner.arch }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.runner.arch }}
      - name: Install declared Python installer and validation dependencies
        run: 'python -m pip install --only-binary=:all: PyYAML==6.0.3 jsonschema==4.26.0 referencing==0.37.0'
      - name: Install and enable Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci --ignore-scripts
      - name: Select the runner's vendor binary
        run: node tests/helpers/native-platform-ci.cjs prepare
      - name: Install exact native Claude package without lifecycle scripts
        shell: bash
        run: npm install --prefix .native-claude --ignore-scripts --no-package-lock --no-audit --no-fund "${CLAUDE_NATIVE_PACKAGE}@${CLAUDE_CODE_VERSION}"
      - name: Require native sandbox and run every Claude capability
        run: node tests/helpers/native-platform-ci.cjs run
      - name: Preserve actual platform evidence and test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-claude-${{ matrix.runner.os }}-node-${{ matrix.node }}
          path: |
            native-platform-evidence.json
            native-platform-tests.log
          if-no-files-found: warn
