name: Release readiness

on:
  push:
    branches:
      - main
    paths:
      - "AUTOPROMPT-TOTAL-FIX-MAP.md"
      - "AUTOPROMPT-IMPLEMENTATION-COVERAGE.json"
      - "CODEX-IMPLEMENTATION-EVIDENCE.json"
      - "agents/**"
      - "agents/codex/**"
      - "agents/contracts/**"
      - "agents/manifests/codex-runtime.json"
      - "bin/**"
      - "evidence/codex-*/**"
      - "packages/codex/**"
      - "scripts/install/**"
      - "scripts/build-release-assets.ps1"
      - "scripts/codex-artifact.cjs"
      - "scripts/codex-configure.cjs"
      - "scripts/codex-evidence-bundle.cjs"
      - "scripts/codex-evidence/**"
      - "scripts/codex-runtime-identity.cjs"
      - "scripts/benchmark-evidence/**"
      - "package.json"
      - "tests/benchmarks/**"
      - "tests/fixtures/codex-*/**"
      - "tests/source/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-readiness.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Full lifecycle and publication gate
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install validation parsers
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3 jsonschema==4.26.0
      - name: Run the full publication gate
        env:
          AUTOPROMPT_RELEASE_QUALITY_EVIDENCE_PATH: ${{ vars.AUTOPROMPT_RELEASE_QUALITY_EVIDENCE_PATH }}
          AUTOPROMPT_RELEASE_QUALITY_TRUST_REGISTRY_PATH: ${{ vars.AUTOPROMPT_RELEASE_QUALITY_TRUST_REGISTRY_PATH }}
        run: npm run prepublishOnly
