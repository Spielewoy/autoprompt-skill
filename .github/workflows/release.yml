name: Release

on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install validation parsers
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3 jsonschema==4.26.0
      - name: Set up npm trusted publishing
        run: npm install --global npm@11.6.3 --ignore-scripts --no-audit --no-fund
      - name: Match tag to package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match package version $version."
          }
      - name: Require the tagged commit on main
        shell: pwsh
        run: |
          & git show-ref --verify --quiet refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not resolve origin/main.'
          }
          & git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tagged commit $env:GITHUB_SHA is not on main."
          }
      - name: Run the complete release gate
        env:
          AUTOPROMPT_RELEASE_QUALITY_EVIDENCE_PATH: ${{ vars.AUTOPROMPT_RELEASE_QUALITY_EVIDENCE_PATH }}
          AUTOPROMPT_RELEASE_QUALITY_TRUST_REGISTRY_PATH: ${{ vars.AUTOPROMPT_RELEASE_QUALITY_TRUST_REGISTRY_PATH }}
        run: npm run prepublishOnly

  publish-release:
    name: Build and publish release assets
    needs: verify-release
    # npm pack must run where Git's executable bits are representable.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Set up npm trusted publishing
        run: npm install --global npm@11.6.3 --ignore-scripts --no-audit --no-fund
      - name: Verify Linux package metadata
        run: node --test --test-name-pattern="every npm-packaged bin entrypoint" tests/source/npm-package.test.cjs
      - name: Build release assets
        shell: pwsh
        run: ./scripts/build-release-assets.ps1
      - name: Publish npm package
        if: github.repository == 'Spielewoy/autoprompt-skill'
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $published = & npm view "$($package.name)@$($package.version)" version --json 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (($published | ConvertFrom-Json) -ne $package.version) {
              throw "npm returned an unexpected version for $($package.name)@$($package.version)."
            }
            Write-Host "$($package.name)@$($package.version) is already published."
          } else {
            $archive = [IO.Path]::GetFullPath((Join-Path dist "$($package.name)-$($package.version).tgz"))
            & npm publish $archive --ignore-scripts --provenance --access public
            if ($LASTEXITCODE -ne 0) {
              throw "npm publish failed with exit code $LASTEXITCODE."
            }
          }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = Get-ChildItem dist -File | Where-Object Name -ne 'RELEASE_NOTES.md' | ForEach-Object FullName
          $repositoryName = $env:GITHUB_REPOSITORY.Split('/', 2)[1]
          $query = 'query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){databaseId}}}'
          $releaseId = gh api graphql -f query=$query -F owner=$env:GITHUB_REPOSITORY_OWNER -F name=$repositoryName -F tag="v$version" --jq '.data.repository.release.databaseId // empty'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not query the existing GitHub release.'
          }
          if ($releaseId) {
            gh release edit "v$version" --title "Autoprompt Skill $version" --notes-file dist/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) {
              throw "Could not update existing release v$version."
            }
            gh release upload "v$version" @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Could not replace assets for release v$version."
            }
          } else {
            gh release create "v$version" @assets --verify-tag --title "Autoprompt Skill $version" --notes-file dist/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create release v$version."
            }
          }
